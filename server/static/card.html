<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM — Картка клієнта</title>
<script src="/static/_sidebar.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', sans-serif;
  background: #0d0d1a;
  color: #e0e0e0;
  min-height: 100vh;
  padding: 16px 12px 40px;
  display: flex;
  justify-content: center;
}

.wrap {
  width: 520px;
  max-width: 100%;
}

/* ── Header ── */
.card-header {
  background: linear-gradient(135deg, #16213e, #0f3460);
  border-radius: 14px 14px 0 0;
  padding: 18px 24px 16px;
  text-align: center;
  border: 1px solid #2a2a4a;
  border-bottom: none;
}
.card-header .label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: #7090b0;
  margin-bottom: 5px;
}
.card-header .phone {
  font-size: 24px;
  font-weight: 700;
  color: #88ccff;
  letter-spacing: 1px;
}
.status-row {
  margin-top: 10px;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 13px;
}
.stat-chip {
  background: rgba(255,255,255,0.07);
  border-radius: 20px;
  padding: 4px 12px;
  color: #aaa;
}
.stat-chip span { color: #fff; font-weight: 600; }
.badge-new {
  background: rgba(100,200,100,0.12);
  color: #88dd88;
  border-radius: 20px;
  padding: 4px 16px;
  font-size: 13px;
  display: inline-block;
  margin-top: 8px;
}

/* ── Panel (shared) ── */
.panel {
  background: #1a1a2e;
  border: 1px solid #2a2a4a;
  border-top: none;
  border-radius: 0 0 14px 14px;
}

/* ── Flags ── */
.flags {
  display: flex;
  gap: 8px;
  padding: 12px 20px;
  border-bottom: 1px solid #222240;
}
.flag-btn {
  flex: 1;
  padding: 8px 0;
  border-radius: 8px;
  border: 2px solid transparent;
  background: rgba(255,255,255,0.04);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: #555;
  transition: all .15s;
}
.flag-btn.active-vip    { background: rgba(255,220,50,0.12); border-color: #ffd700; color: #ffd700; }
.flag-btn.active-prob   { background: rgba(255,80,80,0.12);  border-color: #ff5555; color: #ff5555; }
.flag-btn.active-blocked {
  background: rgba(200,0,0,0.18);
  border-color: #ff2222;
  color: #ff4444;
  font-weight: 800;
  animation: pulse-blocked 1.5s infinite;
}
@keyframes pulse-blocked {
  0%,100% { box-shadow: 0 0 0 0 rgba(255,30,30,0); }
  50%      { box-shadow: 0 0 0 5px rgba(255,30,30,0.2); }
}
/* Blocked banner — завжди видимий, вище форми */
.blocked-banner {
  margin: 0 20px 10px;
  padding: 12px 14px;
  background: rgba(180,0,0,0.2);
  border: 2px solid #cc2222;
  border-radius: 8px;
  color: #ff6666;
  font-size: 13px;
  font-weight: 700;
  display: none;
}
.blocked-banner.visible { display: block; }

/* ── Form ── */
.form-body { padding: 14px 20px 18px; border-bottom: 1px solid #1e1e38; }

.field { margin-bottom: 12px; }
.field:last-child { margin-bottom: 0; }
.field label {
  display: block;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #6070a0;
  margin-bottom: 4px;
  font-weight: 600;
}
.field input,
.field textarea {
  width: 100%;
  background: #111128;
  border: 1px solid #2a2a50;
  border-radius: 7px;
  color: #e0e0f0;
  font-family: 'Segoe UI', sans-serif;
  font-size: 14px;
  padding: 8px 11px;
  outline: none;
  transition: border-color .15s;
  resize: vertical;
}
.field input:focus,
.field textarea:focus { border-color: #4466cc; }
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }

/* ── Actions ── */
.actions {
  display: flex;
  gap: 10px;
  padding: 0 20px 16px;
}
.btn-save {
  flex: 1;
  padding: 11px;
  background: linear-gradient(135deg, #2255cc, #1144aa);
  border: none;
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity .15s;
}
.btn-save:hover { opacity: 0.85; }
.btn-save:disabled { opacity: 0.4; cursor: default; }
.btn-close {
  padding: 11px 18px;
  background: rgba(255,255,255,0.05);
  border: 1px solid #333;
  border-radius: 8px;
  color: #777;
  font-size: 14px;
  cursor: pointer;
}
.btn-close:hover { background: rgba(255,255,255,0.1); }

.toast {
  display: none;
  margin: 0 20px 12px;
  padding: 9px 13px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 600;
  word-break: break-word;
}
.toast.ok  { background: rgba(50,200,100,0.15); color: #55dd88; border: 1px solid #33aa66; }
.toast.err { background: rgba(200,50,50,0.2);   color: #ff8888; border: 2px solid #cc3333; font-size: 12px; }

/* ── Section title ── */
.section-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: #5060a0;
  font-weight: 700;
  padding: 14px 20px 8px;
  border-bottom: 1px solid #1e1e38;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-title .count {
  background: #2a2a50;
  border-radius: 10px;
  padding: 1px 8px;
  color: #aaa;
  font-size: 11px;
  font-weight: 600;
}

/* ── Frequent addresses ── */
.addr-list {
  padding: 8px 20px 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  border-bottom: 1px solid #1e1e38;
}
.addr-chip {
  background: rgba(40,60,120,0.4);
  border: 1px solid #334;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 12px;
  color: #99aacc;
}
.addr-chip .cnt {
  color: #6688cc;
  font-weight: 700;
  margin-right: 4px;
}

/* ── Order history ── */
.orders-list {
  padding: 0 20px 16px;
}
.order-item {
  border-bottom: 1px solid #1a1a32;
  padding: 10px 0;
}
.order-item:last-child { border-bottom: none; }

/* ── Items mini-table ── */
.items-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 5px;
  font-size: 11px;
}
.items-table th {
  color: #4466aa;
  text-align: left;
  padding: 2px 6px 2px 0;
  font-weight: 600;
  font-size: 10px;
  white-space: nowrap;
  border-bottom: 1px solid #1e1e38;
}
.items-table td {
  color: #99aabb;
  padding: 2px 6px 2px 0;
  vertical-align: top;
}
.items-table td:last-child { color: #88dd88; font-weight: 600; }
.items-table tr:first-child td { padding-top: 4px; }

.order-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 4px;
}
.order-date {
  font-size: 11px;
  color: #5568aa;
}
.order-amount {
  font-size: 15px;
  font-weight: 700;
  color: #88dd88;
}

.order-row {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  font-size: 12px;
  color: #7788aa;
  margin-top: 3px;
  line-height: 1.4;
}
.order-row .ico { flex-shrink: 0; }
.order-row .val { color: #aabbd0; }
.order-row .val.muted { color: #667; }

.pay-chip {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 5px;
  font-size: 11px;
  font-weight: 600;
}
.pay-cash  { background: rgba(80,200,80,0.1);  color: #66cc88; }
.pay-card  { background: rgba(80,120,255,0.12); color: #7799ee; }
.pay-other { background: rgba(150,150,150,0.1); color: #888; }

.gift-row {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-top: 3px;
}
.gift-tag {
  background: rgba(255,180,30,0.1);
  border: 1px solid rgba(255,180,30,0.25);
  border-radius: 5px;
  padding: 1px 7px;
  font-size: 11px;
  color: #ccaa44;
}

.empty-history {
  padding: 16px 0;
  text-align: center;
  color: #444;
  font-size: 13px;
}

/* ── Delete order button ── */
.btn-delete-order {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 13px;
  opacity: 0;
  padding: 2px 4px;
  border-radius: 4px;
  transition: opacity .15s, background .15s;
  margin-left: 6px;
  line-height: 1;
}
.order-item:hover .btn-delete-order { opacity: .5; }
.btn-delete-order:hover { opacity: 1 !important; background: rgba(239,68,68,.15); }

/* ── Fade-out animation ── */
@keyframes fadeSlideUp {
  from { opacity: 1; transform: translateY(0); max-height: 200px; }
  to   { opacity: 0; transform: translateY(-6px); max-height: 0; padding: 0; margin: 0; }
}
.order-item.deleting {
  animation: fadeSlideUp .3s ease forwards;
  overflow: hidden;
  pointer-events: none;
}

/* ── Confirm delete modal ── */
.delete-modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.65);
  z-index: 999;
  display: flex; align-items: center; justify-content: center;
}
.delete-modal {
  background: #1a2332;
  border: 1px solid #2d3f55;
  border-radius: 12px;
  padding: 24px 20px 20px;
  width: 320px;
  box-shadow: 0 8px 32px rgba(0,0,0,.5);
}
.delete-modal h3 {
  font-size: 14px; font-weight: 700; color: #f1f5f9;
  margin-bottom: 6px;
}
.delete-modal p {
  font-size: 12px; color: #64748b; margin-bottom: 14px;
}
.delete-modal select {
  width: 100%;
  background: #0f1823; border: 1px solid #2d3f55; color: #e2e8f0;
  border-radius: 6px; padding: 8px 10px; font-size: 13px;
  margin-bottom: 14px; outline: none;
}
.delete-modal-btns {
  display: flex; gap: 8px;
}
.delete-modal-btns .btn-cancel-modal {
  flex: 1; padding: 9px; border-radius: 7px;
  border: 1px solid #2d3f55; background: transparent;
  color: #94a3b8; font-size: 13px; cursor: pointer;
}
.delete-modal-btns .btn-cancel-modal:hover { background: #1e293b; }
.delete-modal-btns .btn-confirm-delete {
  flex: 1; padding: 9px; border-radius: 7px;
  border: 1px solid #ef4444; background: transparent;
  color: #ef4444; font-size: 13px; font-weight: 600; cursor: pointer;
  transition: background .15s, color .15s;
}
.delete-modal-btns .btn-confirm-delete:hover { background: #ef4444; color: #fff; }
.delete-modal-btns .btn-confirm-delete:disabled { opacity: .5; cursor: not-allowed; }

/* ── Smart notifications (duplicate / birthday / promo) ── */
.notif-bar {
  margin: 0 20px 10px;
  padding: 9px 13px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.4;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  animation: notifIn .2s ease;
}
@keyframes notifIn {
  from { opacity: 0; transform: translateY(-4px); }
  to   { opacity: 1; transform: translateY(0); }
}
.notif-bar .notif-close {
  margin-left: auto;
  background: none;
  border: none;
  color: inherit;
  opacity: .6;
  cursor: pointer;
  font-size: 14px;
  flex-shrink: 0;
  padding: 0 2px;
}
.notif-bar .notif-close:hover { opacity: 1; }
.notif-dup  { background: rgba(255,180,0,.1);  border: 1px solid rgba(255,180,0,.3);  color: #ffcc55; }
.notif-bday { background: rgba(255,80,180,.1); border: 1px solid rgba(255,80,180,.3); color: #ff88dd; }
.notif-promo{ background: rgba(100,200,80,.1); border: 1px solid rgba(100,200,80,.3); color: #88dd66; }

/* ── Add order form ── */
.order-form-wrap { border-top: 1px solid #1e1e38; }
.order-form-toggle {
  width: 100%;
  background: none;
  border: none;
  text-align: left;
  padding: 11px 20px;
  color: #5577cc;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: color .15s;
}
.order-form-toggle:hover { color: #88aaff; }
.order-form-toggle .arrow { font-size: 10px; transition: transform .2s; }
.order-form-toggle.open .arrow { transform: rotate(90deg); }

.order-form-body {
  display: none;
  padding: 0 20px 16px;
  border-bottom: 1px solid #1e1e38;
}
.order-form-body.open { display: block; }

.of-row { display: flex; gap: 10px; margin-bottom: 10px; }
.of-row .field { flex: 1; margin-bottom: 0; }
.field.full { margin-bottom: 10px; }

/* сегментні кнопки */
.seg-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.seg-btn {
  flex: 1;
  padding: 7px 4px;
  border-radius: 7px;
  border: 2px solid #2a2a50;
  background: rgba(255,255,255,0.03);
  color: #555;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  text-align: center;
}
.seg-btn.sel-delivery { border-color: #33aacc; background: rgba(51,170,204,0.12); color: #55ccee; }
.seg-btn.sel-pickup   { border-color: #aa6600; background: rgba(170,102,0,0.12);  color: #ddaa44; }
.seg-btn.sel-city     { border-color: #5566bb; background: rgba(85,102,187,0.12); color: #99aaee; }
.seg-btn.sel-cash     { border-color: #44aa55; background: rgba(68,170,85,0.12);  color: #66dd88; }
.seg-btn.sel-card     { border-color: #4466cc; background: rgba(68,102,204,0.12); color: #88aaff; }

#ofAddressRow { display: flex; }

.btn-log {
  width: 100%;
  padding: 11px;
  margin-top: 4px;
  background: linear-gradient(135deg, #335599, #1a3377);
  border: none;
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity .15s;
}
.btn-log:hover { opacity: 0.85; }
.btn-log:disabled { opacity: 0.4; cursor: default; }

.loader {
  text-align: center;
  padding: 50px 20px;
  color: #444;
  font-size: 14px;
}
</style>
</head>
<body>
<div class="wrap">
  <div id="root"><div class="panel"><div class="loader">Завантаження...</div></div></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const phone  = params.get('phone') || '';
const API    = '';  // відносні URL — same-origin cookie

let vip = 0, problem = 0, blocked = 0, blockedReason = '', customerId = null;
let _lastOrders = [];

async function load() {
  try {
    const [custR, ordR] = await Promise.all([
      fetch(`${API}/api/customer/${phone}`).then(r => r.json()),
      fetch(`${API}/api/orders?phone=${phone}`).then(r => r.json()),
    ]);
    render(custR, Array.isArray(ordR) ? ordR : []);
  } catch(e) {
    document.getElementById('root').innerHTML =
      '<div class="panel"><div class="loader" style="color:#f77">Сервер не відповідає.<br>Запустіть start.bat</div></div>';
  }
}

function isBirthdayToday(bday) {
  if (!bday) return false;
  var today = new Date();
  var m = bday.match(/^(\d{1,2})[.\-/](\d{1,2})/);
  if (!m) return false;
  var day = parseInt(m[1], 10), mon = parseInt(m[2], 10);
  return day === today.getDate() && mon === (today.getMonth() + 1);
}

function render(d, orders) {
  vip           = d.vip           || 0;
  problem       = d.problem       || 0;
  blocked       = d.blocked       || 0;
  blockedReason = d.blocked_reason || '';
  customerId    = d.id            || null;
  _lastOrders   = orders;

  // Fuzzy match — показати банер з кнопкою злиття
  if (d.fuzzy_match && d.id) {
    setTimeout(function() {
      showMergeBanner(d);
    }, 300);
  }

  const exists = d.exists;
  const totalO = d.total_orders || 0;
  const totalS = Math.round(d.total_spent || 0);
  const name     = d.name     || '';
  const notes    = d.notes    || '';
  const bday     = d.birthday || '';
  const discount = d.discount || 0;

  // ── Header stats ──────────────────────────────────────────────
  const statsHtml = exists
    ? '<div class="status-row">'
        + '<div class="stat-chip">📦 Замовлень: <span>' + totalO + '</span></div>'
        + '<div class="stat-chip">💰 Витрачено: <span>' + totalS + ' грн</span></div>'
        + avgOrder(totalO, totalS)
      + '</div>'
    : '<div style="margin-top:8px"><span class="badge-new">🆕 Новий клієнт</span></div>';

  // ── Frequent addresses ─────────────────────────────────────────
  // День народження — показати одразу при відкритті
  if (d.exists && isBirthdayToday(bday)) {
    setTimeout(function() {
      showNotif('🎂 Сьогодні день народження у ' + (name || 'клієнта') + '! Привітайте і запропонуйте знижку.', 'bday');
    }, 400);
  }

  const addrMap = {};
  orders.forEach(function(o) {
    const a = (o.address || '').trim();
    if (a && a !== 'САМОВИВІЗ' && a.indexOf('САМОВИВІЗ') !== 0) {
      addrMap[a] = (addrMap[a] || 0) + 1;
    }
  });
  const topAddrs = Object.entries(addrMap).sort(function(a,b){ return b[1]-a[1]; }).slice(0,5);

  const addrSection = topAddrs.length
    ? '<div class="section-title">📍 Часті адреси</div>'
      + '<div class="addr-list">'
      + topAddrs.map(function(e){ return '<div class="addr-chip"><span class="cnt">×' + e[1] + '</span>' + esc(e[0]) + '</div>'; }).join('')
      + '</div>'
    : '';

  // ── Orders history ─────────────────────────────────────────────
  const ordersHtml = orders.length
    ? orders.map(renderOrder).join('')
    : '<div class="empty-history">Замовлень ще немає</div>';

  document.getElementById('root').innerHTML =
    '<div class="card-header">'
    + '<div class="label">Картка клієнта</div>'
    + '<div class="phone">' + formatPhone(phone) + '</div>'
    + statsHtml
    + '</div>'

    + '<div class="panel">'

    + '<div class="blocked-banner' + (blocked ? ' visible' : '') + '" id="blockedBanner">'
    +   '🚫 КЛІЄНТ ЗАБЛОКОВАНИЙ' + (blockedReason ? ': ' + esc(blockedReason) : '') + '</div>'
    + '<div class="flags">'
    + '<button class="flag-btn' + (vip ? ' active-vip' : '') + '" id="btnVip" onclick="toggleVip()">⭐ VIP</button>'
    + '<button class="flag-btn' + (problem ? ' active-prob' : '') + '" id="btnProb" onclick="toggleProb()">⚠️ Проблемний</button>'
    + '<button class="flag-btn' + (blocked ? ' active-blocked' : '') + '" id="btnBlocked" onclick="toggleBlocked()">🚫 Блок</button>'
    + '</div>'

    + '<div class="form-body">'
    + '<div class="field"><label>Ім\'я клієнта</label><input type="text" id="fName" value="' + esc(name) + '" placeholder="Ольга, Михайло..."></div>'
    + '<div class="field-row">'
    + '<div class="field"><label>🎂 День народження (дд.мм)</label><input type="text" id="fBday" value="' + esc(bday) + '" placeholder="15.03"></div>'
    + '<div class="field" style="flex:0 0 110px"><label>💸 Знижка (%)</label><input type="number" id="fDiscount" min="0" max="100" value="' + discount + '" style="width:100%' + (discount > 0 ? ';border-color:#ffaa44;color:#ffaa44' : '') + '"></div>'
    + '<div class="field" style="flex:2"><label>📝 Нотатки (алергії, побажання)</label><input type="text" id="fNotes" value="' + esc(notes) + '" placeholder="Без цибулі..."></div>'
    + '</div></div>'

    + '<div class="toast" id="toast"></div>'

    + '<div class="actions">'
    + '<button class="btn-save" id="btnSave" onclick="save()">💾 Зберегти</button>'
    + (orders.length ? '<button class="btn-close" style="border-color:#336655;color:#66dd99" onclick="repeatOrder()" title="Відкрити дашборд і скопіювати останнє замовлення">🔁 Повторити</button>' : '')
    + '<button class="btn-close" onclick="window.close()">✖</button>'
    + '</div>'

    + '<div class="order-form-wrap">'
    + '<button class="order-form-toggle" id="ofToggle" onclick="toggleOrderForm()"><span class="arrow">▶</span> ➕ Внести замовлення</button>'
    + '<div class="order-form-body" id="ofBody">'

    // тип доставки
    + '<div class="field full"><label>Тип</label><div class="seg-btns">'
    + '<button class="seg-btn" id="dtDelivery" onclick="selDelivery(\'delivery\')">🚗 Доставка</button>'
    + '<button class="seg-btn" id="dtPickup"   onclick="selDelivery(\'pickup\')">🏃 Самовивіз</button>'
    + '</div></div>'

    // місто
    + '<div class="field full"><label>Місто / Точка</label><div class="seg-btns">'

function renderOrder(o) {
  const dt     = fmtDate(o.order_date);
  const amount = o.amount ? Math.round(o.amount) + ' грн' : '—';
  const addr   = (o.address || '').trim();
  const pay    = (o.payment_type || '').trim();
  const gifts  = (o.gift || '').trim();
  const cmt    = (o.comment || '').trim();
  const items  = (o.items || '').trim();

  const isPickup = addr.indexOf('САМОВИВІЗ') === 0;
  const payClass = pay.indexOf('Готів') >= 0 ? 'pay-cash'
                 : (pay.indexOf('Картк') >= 0 || pay.indexOf('Термін') >= 0) ? 'pay-card'
                 : pay ? 'pay-other' : '';
  const payIcon = pay.indexOf('Готів') >= 0 ? '💵' : '💳';

  const addrRow = addr
    ? '<div class="order-row"><span class="ico">' + (isPickup ? '🏃' : '📍') + '</span><span class="val">' + esc(addr) + '</span></div>'
    : '';
  const itemsRow = items ? renderItemsTable(items) : '';
  const payRow = pay
    ? '<div class="order-row"><span class="ico">' + payIcon + '</span><span class="pay-chip ' + payClass + '">' + esc(pay) + '</span></div>'
    : '';
  const cmtRow = cmt
    ? '<div class="order-row"><span class="ico">💬</span><span class="val muted">' + esc(cmt) + '</span></div>'
    : '';
  const giftRow = gifts
    ? '<div class="gift-row">' + gifts.trim().split(/[,\s]+/).filter(Boolean).map(function(g){ return '<span class="gift-tag">🎁 ' + esc(g) + '</span>'; }).join('') + '</div>'
    : '';

  return '<div class="order-item" id="order-' + o.id + '">'
    + '<div class="order-top">'
    +   '<span class="order-date">' + dt + '</span>'
    +   '<span class="order-amount">' + amount + '</span>'
    +   '<button class="btn-delete-order" title="Видалити замовлення" onclick="confirmDeleteOrder(' + o.id + ', \'' + esc(amount) + '\', \'' + esc(dt) + '\')" aria-label="Видалити">🗑️</button>'
    + '</div>'
    + itemsRow + addrRow + payRow + cmtRow + giftRow
    + '</div>';
}

// Парсить iiko-формат позицій:
// "Блюдо\tКоличество\tКомментарий\tЦена\tСумма\nХоккайдо\t1,000\t\t1 295,00\t1 295,00\nБлюдо\t..."
// або все в одному рядку (без \n між записами)
function renderItemsTable(raw) {
  var hasTabs = raw.indexOf('\t') >= 0;
  // iiko header pattern
  var HEADER = /Блюдо[\t ]+Количество[\t ]+Комментарий[\t ]+Цена[\t ]+Сумма/g;
  var isIiko = HEADER.test(raw);
  HEADER.lastIndex = 0;

  if (!isIiko && !hasTabs) {
    // звичайний текст — просто показуємо
    return '<div class="order-row"><span class="ico">🍱</span><span class="val">' + esc(raw) + '</span></div>';
  }

  var cleaned;
  if (isIiko) {
    // Видаляємо всі заголовки, замінюємо на \n
    cleaned = raw.replace(HEADER, '\n').trim();
  } else {
    cleaned = raw.trim();
  }

  var lines = cleaned.split(/[\n\r]+/).map(function(l){ return l.trim(); }).filter(Boolean);

  var items = [];
  lines.forEach(function(line) {
    var cols = line.split('\t');
    var dish = (cols[0] || '').trim();
    // Пропускаємо рядки без назви або якщо це залишок хедера
    if (!dish || dish === 'Блюдо') return;
    var qty   = (cols[1] || '').trim().replace(/[,\.]\d{3}$/, '');  // "1,000" → "1"
    var price = (cols[3] || '').trim();
    var total = (cols[4] || '').trim();
    items.push({ dish: dish, qty: qty, price: price, total: total });
  });

  if (!items.length) {
    return '<div class="order-row"><span class="ico">🍱</span><span class="val">' + esc(raw) + '</span></div>';
  }

  var rows = items.map(function(it) {
    return '<tr>'
      + '<td>' + esc(it.dish) + '</td>'
      + '<td style="text-align:center;white-space:nowrap">' + esc(it.qty) + '</td>'
      + '<td style="text-align:right;white-space:nowrap;color:#889">' + esc(it.price) + '</td>'
      + '<td style="text-align:right;white-space:nowrap">' + esc(it.total) + '</td>'
      + '</tr>';
  }).join('');

  return '<table class="items-table">'
    + '<thead><tr><th>🍱 Страва</th><th>Кіл.</th><th>Ціна</th><th>Сума</th></tr></thead>'
    + '<tbody>' + rows + '</tbody>'
    + '</table>';
}

function avgOrder(cnt, total) {
  if (!cnt || !total) return '';
  return '<div class="stat-chip">📊 Середній: <span>' + Math.round(total/cnt) + ' грн</span></div>';
}

function fmtDate(s) {
  if (!s) return '—';
  try {
    const d = new Date(s.replace(' ', 'T'));
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const hh = String(d.getHours()).padStart(2,'0');
    const mn = String(d.getMinutes()).padStart(2,'0');
    return dd + '.' + mm + ' ' + hh + ':' + mn;
  } catch(e) { return s.slice(0,10); }
}

function formatPhone(p) {
  if (p.length === 12 && p.startsWith('380'))
    return '+' + p.slice(0,3) + ' (' + p.slice(3,5) + ') ' + p.slice(5,8) + '-' + p.slice(8,10) + '-' + p.slice(10);
  if (p.length === 10 && p.charAt(0) === '0')
    return '(' + p.slice(0,3) + ') ' + p.slice(3,6) + '-' + p.slice(6,8) + '-' + p.slice(8);
  return p;
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function repeatOrder() {
  // Open dashboard with pre-filled phone and duplicate last order
  const last = _lastOrders[0];
  if (!last) return;
  // Encode order fields as URL params for dashboard to pick up
  const p = new URLSearchParams({ repeat_phone: phone });
  if (last.id)           p.set('repeat_order_id', last.id);
  if (last.amount)       p.set('repeat_amount',   last.amount);
  if (last.address)      p.set('repeat_address',  last.address);
  if (last.items)        p.set('repeat_items',     last.items);
  if (last.delivery_type) p.set('repeat_delivery', last.delivery_type);
  if (last.payment_type)  p.set('repeat_payment',  last.payment_type);
  if (last.city)          p.set('repeat_city',     last.city);
  window.open('/dashboard?' + p.toString(), '_blank');
}

async function toggleBlocked() {
  if (!customerId) { showToast('Спершу збережіть клієнта', 'err'); return; }
  const newBlocked = blocked ? 0 : 1;
  let reason = '';
  if (newBlocked) {
    reason = prompt('Причина блокування (обов\'язково):');
    if (reason === null) return;           // відміна
    reason = reason.trim();
    if (!reason) { showToast('Введіть причину блокування', 'err'); return; }
  }
  try {
    const r = await fetch(API + '/api/customer/' + customerId + '/block', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ blocked: newBlocked, reason, actor_id: 0, actor_role: 'manager' })
    });
    const d = await r.json();
    if (d.ok) {
      blocked = newBlocked;
      blockedReason = reason;
      // Оновити кнопку і банер
      document.getElementById('btnBlocked').className = 'flag-btn' + (blocked ? ' active-blocked' : '');
      const banner = document.getElementById('blockedBanner');
      if (banner) {
        banner.className = 'blocked-banner' + (blocked ? ' visible' : '');
        banner.textContent = blocked
          ? '🚫 КЛІЄНТ ЗАБЛОКОВАНИЙ' + (reason ? ': ' + reason : '')
          : '';
      }
      showToast(blocked ? '🚫 Клієнта заблоковано' : '✅ Блокування знято', blocked ? 'err' : 'ok');
    } else {
      showToast('❌ ' + (d.error || 'Помилка'), 'err');
    }
  } catch(e) {
    showToast('❌ Сервер не відповідає', 'err');
  }
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
  t.style.display = 'block';
  t.style.cursor = 'pointer';
  t.onclick = function(){ t.style.display = 'none'; };
  // Помилки не зникають самі — лише клік
  if (type === 'ok') {
    setTimeout(function(){ t.style.display = 'none'; }, 4000);
  }
}

async function logOrder() {
  if (!phone) {
    showToast('❌ Картка відкрита без номера телефону', 'err');
    return;
  }

  const amount  = parseFloat(document.getElementById('ofAmount').value) || 0;
  const addrEl  = document.getElementById('ofAddress');
  const address = addrEl ? addrEl.value.trim() : '';
  const itemsEl = document.getElementById('ofItems');
  const items   = itemsEl ? itemsEl.value.trim() : '';
  const gift    = document.getElementById('ofGift').value.trim();
  const comment = document.getElementById('ofComment').value.trim();
  const payType = selectedPay === 'cash' ? 'Готівка' : selectedPay === 'card' ? 'Картка' : '';

  const finalAddr = selectedDelivery === 'pickup'
    ? ('САМОВИВІЗ' + (selectedCity ? ' ' + selectedCity : ''))
    : (selectedCity && address ? selectedCity + ', ' + address : address);

  if (!amount && !finalAddr && !items) {
    showToast('Заповніть хоча б суму або що замовив', 'err');
    return;
  }

  const btn = document.getElementById('btnLog');
  btn.disabled = true;
  btn.textContent = '⏳ Записую...';

  try {
    const r = await fetch(API + '/api/order', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        phone,
        amount,
        address:       finalAddr,
        items,
        gift,
        comment,
        payment_type:  payType,
        city:          selectedCity,
        delivery_type: selectedDelivery
      })
    });
    const d = await r.json();
    if (d.ok) {
      showToast('✅ Записано!', 'ok');
      document.getElementById('ofAmount').value  = '';
      if (addrEl) addrEl.value = '';
      if (itemsEl) itemsEl.value = '';
      document.getElementById('ofGift').value    = '';
      document.getElementById('ofComment').value = '';
      selectedPay = ''; selectedDelivery = ''; selectedCity = '';
      btn.textContent = '✅ Записати замовлення';
      btn.disabled = false;
      setTimeout(function() {
        load();
        // Показуємо smart-нотифікації після оновлення DOM
        setTimeout(function() {
          if (d.duplicate_warning) showNotif(d.duplicate_warning, 'dup');
          if (d.birthday)          showNotif(d.birthday, 'bday');
          if (d.promo)             showNotif(d.promo, 'promo');
        }, 300);
      }, 800);
    } else {
      showToast('❌ ' + (d.error || 'невідома помилка'), 'err');
      btn.textContent = '✅ Записати замовлення';
      btn.disabled = false;
    }
  } catch(e) {
    showToast('❌ Сервер не відповідає: ' + e.message, 'err');
    btn.textContent = '✅ Записати замовлення';
    btn.disabled = false;
  }
}

// ── Smart notifications ──────────────────────────────────────────

function showNotif(msg, type) {
  // type: 'dup' | 'bday' | 'promo'
  var container = document.getElementById('notifContainer');
  if (!container) return;
  var bar = document.createElement('div');
  bar.className = 'notif-bar notif-' + type;
  bar.innerHTML = '<span>' + esc(msg) + '</span>'
    + '<button class="notif-close" onclick="this.parentNode.remove()">✕</button>';
  container.insertBefore(bar, container.firstChild);
  // бадейка сама зникає через 12 секунд
  setTimeout(function() { if (bar.parentNode) bar.remove(); }, 12000);
}

// ── Merge / fuzzy-match banner ───────────────────────────────────

function showMergeBanner(d) {
  // Викликається коли клієнта знайдено за нечітким збігом номера (fuzzy_match=true)
  // d — дані клієнта зі сторони БД (d.phone — збережений номер)
  var container = document.getElementById('notifContainer');
  if (!container || document.getElementById('mergeBanner')) return;
  var searchedPhone = new URLSearchParams(window.location.search).get('phone') || '';
  var msg = '📞 Клієнта знайдено за нечітким збігом номера.';
  if (searchedPhone && searchedPhone !== d.phone) {
    msg += ' Шуканий: <b>' + esc(searchedPhone) + '</b> → Збережений: <b>' + esc(d.phone) + '</b>';
  } else {
    msg += ' Збережений номер: <b>' + esc(d.phone) + '</b>';
  }
  var bar = document.createElement('div');
  bar.id = 'mergeBanner';
  bar.className = 'notif-bar notif-dup';
  bar.innerHTML = '<span>' + msg + '</span>'
    + '<a href="/customers" style="color:#88aaff;font-size:11px;margin-left:12px;white-space:nowrap">🔍 Всі дублікати</a>'
    + '<button class="notif-close" onclick="this.parentNode.remove()">✕</button>';
  container.insertBefore(bar, container.firstChild);
}

// ── Delete order ─────────────────────────────────────────────────

var _deleteOrderId = null;

var DELETE_REASONS = [
  { value: 'duplicate',      label: 'Дублікат замовлення' },
  { value: 'test',           label: 'Тестове замовлення' },
  { value: 'client_refused', label: 'Клієнт відмовився' },
  { value: 'address_error',  label: 'Помилка адреси' },
  { value: 'other',          label: 'Інша причина' },
];

function confirmDeleteOrder(orderId, amount, dateStr) {
  _deleteOrderId = orderId;

  var opts = DELETE_REASONS.map(function(r) {
    return '<option value="' + r.value + '">' + r.label + '</option>';
  }).join('');

  var overlay = document.createElement('div');
  overlay.className = 'delete-modal-overlay';
  overlay.id = 'deleteModalOverlay';
  overlay.innerHTML =
    '<div class="delete-modal">'
    + '<h3>🗑️ Видалити замовлення?</h3>'
    + '<p>' + esc(dateStr) + ' · ' + esc(amount) + '</p>'
    + '<select id="deleteReason">' + opts + '</select>'
    + '<div class="delete-modal-btns">'
    +   '<button class="btn-cancel-modal" onclick="closeDeleteModal()">Скасувати</button>'
    +   '<button class="btn-confirm-delete" id="btnConfirmDelete" onclick="executeDeleteOrder()">Видалити</button>'
    + '</div>'
    + '</div>';

  // Клік на overlay (поза modal) — закриває
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) closeDeleteModal();
  });

  document.body.appendChild(overlay);
}

function closeDeleteModal() {
  var el = document.getElementById('deleteModalOverlay');
  if (el) el.remove();
  _deleteOrderId = null;
}

async function executeDeleteOrder() {
  if (!_deleteOrderId) return;
  var reason = document.getElementById('deleteReason').value;
  var btn = document.getElementById('btnConfirmDelete');
  btn.disabled = true;
  btn.textContent = 'Видаляю...';

  try {
    var resp = await fetch('/api/order/' + _deleteOrderId, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reason: reason, actor_id: 0, actor_role: 'manager' })
    });
    var data = await resp.json();
    if (data.ok) {
      closeDeleteModal();
      // Fade-out анімація
      var row = document.getElementById('order-' + _deleteOrderId);
      if (row) {
        row.classList.add('deleting');
        setTimeout(function() { if (row) row.remove(); }, 320);
      }
      showToast('✅ Замовлення видалено', 'ok');
    } else {
      btn.disabled = false;
      btn.textContent = 'Видалити';
      var errEl = document.createElement('p');
      errEl.style.cssText = 'color:#ef4444;font-size:11px;margin-top:8px;text-align:center';
      errEl.textContent = data.error || 'Помилка';
      var modal = document.querySelector('.delete-modal');
      // remove prev error if any
      var prev = modal.querySelector('.del-err');
      if (prev) prev.remove();
      errEl.className = 'del-err';
      modal.appendChild(errEl);
    }
  } catch(e) {
    btn.disabled = false;
    btn.textContent = 'Видалити';
    showToast('❌ Помилка мережі: ' + e.message, 'err');
  }
}
