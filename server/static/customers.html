<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RollHouse PRO — Клієнти</title>
<script src="/static/_sidebar.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #0a0a14; color: #d0d0e0; min-height: 100vh; }

.topbar {
  background: #111120; border-bottom: 1px solid #1e1e38;
  padding: 0 20px; height: 48px;
  display: flex; align-items: center; gap: 16px;
  position: sticky; top: 0; z-index: 100;
}
.logo { font-size: 15px; font-weight: 800; color: #88aaff; }
.nav-link { font-size: 13px; color: #5566aa; text-decoration: none; padding: 4px 10px; border-radius: 6px; }
.nav-link:hover { background: rgba(100,120,255,.1); color: #88aaff; }
.spacer { flex: 1; }
.page-title { font-size: 13px; color: #5566aa; font-weight: 600; }

.toolbar {
  display: flex; gap: 8px; padding: 12px 20px;
  border-bottom: 1px solid #1a1a30; flex-wrap: wrap; align-items: center;
}
.search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 340px; }
.search-wrap input {
  width: 100%; background: #111128; border: 1px solid #252545; border-radius: 8px;
  color: #d0d0e8; font-size: 13px; padding: 7px 12px 7px 32px; outline: none;
  font-family: 'Segoe UI', sans-serif;
}
.search-wrap input:focus { border-color: #4466cc; }
.search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #445; font-size: 14px; }

.filter-chip {
  padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
  cursor: pointer; border: 1px solid #252545; background: none; color: #5566aa;
  font-family: 'Segoe UI', sans-serif;
}
.filter-chip.active { background: #1a2055; border-color: #4466cc; color: #88aaff; }
.filter-chip:hover:not(.active) { border-color: #445; color: #88aaff; }

.sort-select {
  background: #111128; border: 1px solid #252545; border-radius: 8px;
  color: #d0d0e8; font-size: 12px; padding: 6px 10px; outline: none;
  font-family: 'Segoe UI', sans-serif; cursor: pointer;
}
.total-label { font-size: 12px; color: #445; margin-left: 4px; }

/* Table */
.table-wrap { overflow-x: auto; padding: 0 20px 24px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
th {
  text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
  color: #445; font-weight: 700; padding: 0 10px 8px; border-bottom: 1px solid #1e1e38;
  white-space: nowrap; cursor: pointer; user-select: none;
}
th:hover { color: #88aaff; }
th.sorted { color: #88aaff; }
td { padding: 9px 10px; border-bottom: 1px solid #131328; vertical-align: middle; }
tr:hover td { background: rgba(30,30,60,.4); }

.name-cell a { color: #ccd; text-decoration: none; font-weight: 600; }
.name-cell a:hover { color: #88aaff; }
.phone-cell { font-family: monospace; font-size: 12px; color: #667; }

.badge {
  display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px;
  border-radius: 20px; margin-right: 3px; white-space: nowrap;
}
.badge-vip      { background: #2a2000; color: #ffcc55; border: 1px solid #554400; }
.badge-blocked  { background: #2a0010; color: #ff6666; border: 1px solid #551122; }
.badge-discount { background: #1a2050; color: #88aaff; border: 1px solid #2a3080; }

.orders-num { font-weight: 700; color: #88aaff; }
.spent-num  { color: #66dd99; font-weight: 600; }
.date-cell  { font-size: 11px; color: #334; white-space: nowrap; }

.empty { text-align: center; color: #334; padding: 40px; font-size: 14px; }

.pagination { display: flex; gap: 8px; align-items: center; padding: 12px 20px; }
.btn-page {
  padding: 5px 14px; background: none; border: 1px solid #252545;
  border-radius: 6px; color: #5566aa; font-size: 12px; cursor: pointer;
  font-family: 'Segoe UI', sans-serif;
}
.btn-page:hover:not(:disabled) { border-color: #5566aa; color: #88aaff; }
.btn-page:disabled { opacity: .35; cursor: default; }
.page-info { font-size: 12px; color: #445; }

/* Duplicate finder */
.dup-section { padding: 16px 20px 24px; border-top: 1px solid #1e1e38; }
.dup-section-title { font-size: 13px; font-weight: 700; color: #ffcc55; margin-bottom: 14px; }
.dup-pair {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  background: #0f0f22; border: 1px solid #2a2040; border-radius: 10px; padding: 12px 14px;
}
.dup-card { flex: 1; }
.dup-card-name { font-weight: 700; font-size: 13px; color: #ccd; }
.dup-card-phone { font-family: monospace; font-size: 12px; color: #667; margin-top: 2px; }
.dup-card-orders { font-size: 11px; color: #445; margin-top: 2px; }
.dup-sep { color: #334; font-size: 18px; padding: 0 4px; }
.btn-merge {
  padding: 6px 14px; background: #1a1040; border: 1px solid #5533aa;
  border-radius: 6px; color: #aa88ff; font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: 'Segoe UI', sans-serif; white-space: nowrap;
}
.btn-merge:hover { background: #2a1060; border-color: #7755cc; color: #cc99ff; }
.dup-empty { color: #334; font-size: 13px; padding: 10px 0; }

/* Merge confirm modal */
.merge-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 2000;
  display: flex; align-items: center; justify-content: center;
}
.merge-modal {
  background: #111128; border: 1px solid #2a2a4a; border-radius: 14px;
  padding: 24px; max-width: 460px; width: 90%;
}
.merge-modal h3 { font-size: 15px; font-weight: 800; color: #ffcc55; margin-bottom: 16px; }
.merge-choice {
  display: flex; gap: 10px; margin-bottom: 16px;
}
.merge-opt {
  flex: 1; padding: 12px; border-radius: 10px; border: 2px solid #252545;
  cursor: pointer; background: #0a0a18; transition: .15s;
}
.merge-opt:hover { border-color: #5533aa; background: #110d28; }
.merge-opt.selected { border-color: #aa88ff; background: #1a1040; }
.merge-opt-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #445; font-weight: 700; margin-bottom: 6px; }
.merge-opt-name { font-size: 13px; font-weight: 700; color: #ccd; }
.merge-opt-phone { font-family: monospace; font-size: 12px; color: #667; margin-top: 2px; }
.merge-opt-orders { font-size: 11px; color: #66dd99; margin-top: 2px; }
.merge-note { font-size: 11px; color: #445; line-height: 1.5; margin-bottom: 16px; }
.merge-btns { display: flex; gap: 10px; justify-content: flex-end; }
.btn-merge-cancel { padding: 7px 18px; background: none; border: 1px solid #252545; border-radius: 8px; color: #5566aa; font-size: 13px; cursor: pointer; font-family: 'Segoe UI', sans-serif; }
.btn-merge-confirm { padding: 7px 18px; background: #1a1040; border: 1px solid #5533aa; border-radius: 8px; color: #aa88ff; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Segoe UI', sans-serif; }
.btn-merge-confirm:hover { background: #2a1060; }
.btn-merge-confirm:disabled { opacity: .4; cursor: default; }

/* CSV Import */
.import-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 2100;
  display: flex; align-items: center; justify-content: center;
}
.import-modal {
  background: #111128; border: 1px solid #2a2a4a; border-radius: 14px;
  padding: 24px; max-width: 600px; width: 95%; max-height: 90vh; overflow-y: auto;
}
.import-modal h3 { font-size: 15px; font-weight: 800; color: #66dd99; margin-bottom: 6px; }
.import-modal p { font-size: 12px; color: #445; margin-bottom: 16px; line-height: 1.5; }
.import-drop {
  border: 2px dashed #252545; border-radius: 10px; padding: 28px;
  text-align: center; cursor: pointer; transition: .15s; margin-bottom: 14px;
}
.import-drop:hover, .import-drop.drag { border-color: #4466cc; background: rgba(68,102,204,.05); }
.import-drop-icon { font-size: 32px; margin-bottom: 8px; }
.import-drop-text { font-size: 13px; color: #5566aa; }
.import-drop-hint { font-size: 11px; color: #334; margin-top: 4px; }
.import-file-input { display: none; }
.import-mapping {
  background: #0a0a18; border: 1px solid #1e1e38; border-radius: 8px;
  padding: 12px; margin-bottom: 14px; font-size: 12px;
}
.import-mapping-title { color: #5566aa; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; font-size: 10px; letter-spacing: 1px; }
.import-map-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.import-map-label { color: #445; width: 80px; flex-shrink: 0; }
.import-map-select { background: #111128; border: 1px solid #252545; border-radius: 6px; color: #d0d0e8; font-size: 12px; padding: 4px 8px; flex: 1; font-family: 'Segoe UI', sans-serif; outline: none; }
.import-map-select:focus { border-color: #4466cc; }
.import-preview { margin-bottom: 14px; }
.import-preview-title { font-size: 11px; color: #445; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.import-preview table { width: 100%; border-collapse: collapse; font-size: 11px; }
.import-preview th { color: #334; padding: 4px 8px; border-bottom: 1px solid #1e1e38; text-align: left; font-weight: 600; }
.import-preview td { padding: 3px 8px; border-bottom: 1px solid #0f0f22; color: #9999bb; }
.import-result { background: #0a0a18; border-radius: 8px; padding: 12px; margin-bottom: 14px; font-size: 13px; }
.import-result-ok  { color: #66dd99; font-weight: 700; }
.import-result-skip { color: #ffcc55; }
.import-result-err { color: #ff7777; font-size: 11px; margin-top: 8px; max-height: 100px; overflow-y: auto; }
.btn-import {
  padding: 8px 20px; background: #0d2b1a; border: 1px solid #33aa66;
  border-radius: 8px; color: #66dd99; font-size: 13px; font-weight: 700;
  cursor: pointer; font-family: 'Segoe UI', sans-serif;
}
.btn-import:hover { background: #0f3a22; }
.btn-import:disabled { opacity: .4; cursor: default; }
.btn-import-csv {
  padding: 5px 14px; background: #0d2b1a; border: 1px solid #33aa66;
  border-radius: 20px; color: #66dd99; font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: 'Segoe UI', sans-serif;
}
.btn-import-csv:hover { background: #0f3a22; }
</style>
</head>
<body>

<div class="topbar">
  <span class="logo" style="color:#5566aa;opacity:.6">Клієнти</span>
  <div class="spacer"></div>
  <a id="reminderNavBtn" href="/dashboard" style="display:none;border:1px solid #cc5500;color:#ffaa44;border-radius:20px;padding:3px 10px;font-size:12px;text-decoration:none" title="Є нагадування — перейти на дашборд">🔔 <span id="reminderNavCount">0</span></a>
</div>
<script>
(function reminderBadge() {
  async function checkDue() {
    try {
      const r = await fetch('/api/reminders/due-count');
      const d = await r.json();
      const btn = document.getElementById('reminderNavBtn');
      if (d.count > 0) {
        document.getElementById('reminderNavCount').textContent = d.count;
        btn.style.display = 'inline';
      } else { btn.style.display = 'none'; }
    } catch {}
  }
  checkDue();
  setInterval(checkDue, 60000);
})();
</script>

<div id="statsBar" style="display:flex;gap:24px;padding:10px 20px 0;font-size:13px;color:#445;border-bottom:none"></div>

<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Телефон або ім'я..." oninput="debouncedLoad()">
  </div>
  <button class="filter-chip" id="chipAll"     onclick="setFilter('all')">Всі</button>
  <button class="filter-chip" id="chipVip"     onclick="setFilter('vip')">⭐ VIP</button>
  <button class="filter-chip" id="chipBlocked" onclick="setFilter('blocked')">🚫 Заблоковані</button>
  <select class="sort-select" id="sortSelect" onchange="load(0)">
    <option value="total_orders">За кількістю замовлень</option>
    <option value="total_spent">За сумою витрат</option>
    <option value="updated_at">За активністю</option>
    <option value="created_at">За датою реєстрації</option>
    <option value="name">За ім'ям</option>
  </select>
  <span class="total-label" id="totalLabel"></span>
  <button class="filter-chip" id="chipDups" onclick="toggleDuplicates()" style="border-color:#5533aa;color:#aa88ff">🔍 Дублікати</button>
  <button class="btn-import-csv" onclick="openImportModal()">📥 Імпорт CSV</button>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th onclick="setSort('name')">Ім'я / Статус</th>
        <th onclick="setSort('name')">Телефон</th>
        <th onclick="setSort('total_orders')">Замовлень</th>
        <th onclick="setSort('total_spent')">Витрачено</th>
        <th>Знижка</th>
        <th onclick="setSort('updated_at')">Остання дія</th>
        <th onclick="setSort('created_at')">Реєстрація</th>
      </tr>
    </thead>
    <tbody id="tbody">
      <tr><td colspan="7" class="empty">Завантаження...</td></tr>
    </tbody>
  </table>
</div>

<div class="pagination">
  <button class="btn-page" id="btnPrev" onclick="prevPage()" disabled>← Назад</button>
  <span class="page-info" id="pageInfo"></span>
  <button class="btn-page" id="btnNext" onclick="nextPage()" disabled>Далі →</button>
</div>

<div class="dup-section" id="dupSection" style="display:none">
  <div class="dup-section-title">⚠️ Можливі дублікати клієнтів</div>
  <div id="dupList"><span class="dup-empty">Завантаження...</span></div>
</div>

<script>
const PAGE_SIZE = 50;
let _offset = 0;
let _total  = 0;
let _filter = 'all';   // 'all' | 'vip' | 'blocked'
let _debounce;

function setFilter(f) {
  _filter = f;
  ['all','vip','blocked'].forEach(k => {
    document.getElementById('chip' + k.charAt(0).toUpperCase() + k.slice(1))
      .classList.toggle('active', k === f);
  });
  load(0);
}

function setSort(col) {
  document.getElementById('sortSelect').value = col;
  load(0);
}

function debouncedLoad() {
  clearTimeout(_debounce);
  _debounce = setTimeout(() => load(0), 280);
}

function buildParams(offset) {
  const p = new URLSearchParams();
  const q = document.getElementById('searchInput').value.trim();
  if (q) p.set('q', q);
  if (_filter === 'vip')     p.set('vip', 1);
  if (_filter === 'blocked') p.set('blocked', 1);
  p.set('sort', document.getElementById('sortSelect').value);
  p.set('limit', PAGE_SIZE);
  p.set('offset', offset);
  return p.toString();
}

async function load(offset) {
  _offset = offset;
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '<tr><td colspan="7" class="empty">Завантаження...</td></tr>';
  try {
    const r = await fetch('/api/customers/search?' + buildParams(offset));
    const d = await r.json();
    _total = d.total || 0;
    document.getElementById('totalLabel').textContent = `Знайдено: ${_total}`;
    updatePagination();
    if (!d.items || !d.items.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty">Клієнтів не знайдено</td></tr>';
      return;
    }
    tbody.innerHTML = d.items.map(c => {
      const badges = [
        c.vip     ? '<span class="badge badge-vip">⭐ VIP</span>' : '',
        c.blocked ? '<span class="badge badge-blocked">🚫</span>' : '',
      ].join('');
      const phoneLink = `<a href="/card?phone=${enc(c.phone)}" style="color:#667;font-family:monospace;font-size:12px;text-decoration:none">${esc(c.phone)}</a>`;
      const nameLink  = `<a href="/card?phone=${enc(c.phone)}">${esc(c.name || '—')}</a>`;
      const discount  = c.discount ? `<span class="badge badge-discount">${c.discount}%</span>` : '<span style="color:#334">—</span>';
      return `<tr>
        <td class="name-cell">${nameLink} ${badges}</td>
        <td class="phone-cell">${phoneLink}</td>
        <td><span class="orders-num">${c.total_orders || 0}</span></td>
        <td><span class="spent-num">${(c.total_spent || 0).toLocaleString('uk-UA', {minimumFractionDigits:0, maximumFractionDigits:0})} ₴</span></td>
        <td>${discount}</td>
        <td class="date-cell">${fmtDate(c.updated_at)}</td>
        <td class="date-cell">${fmtDate(c.created_at)}</td>
      </tr>`;
    }).join('');
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="7" class="empty">Помилка: ${e.message}</td></tr>`;
  }
}

function updatePagination() {
  const page  = Math.floor(_offset / PAGE_SIZE) + 1;
  const pages = Math.ceil(_total / PAGE_SIZE) || 1;
  document.getElementById('pageInfo').textContent = `Сторінка ${page} з ${pages} (${_total} клієнтів)`;
  document.getElementById('btnPrev').disabled = _offset <= 0;
  document.getElementById('btnNext').disabled = _offset + PAGE_SIZE >= _total;
}
function prevPage() { if (_offset > 0) load(_offset - PAGE_SIZE); }
function nextPage() { if (_offset + PAGE_SIZE < _total) load(_offset + PAGE_SIZE); }

function fmtDate(s) {
  if (!s) return '—';
  return s.slice(0, 10);
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function enc(s) { return encodeURIComponent(s||''); }

document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { clearTimeout(_debounce); load(0); }
});

// ── PIN auth guard ──
(function() {
  if (sessionStorage.getItem('rh_pin_ok') === '1') return;
  const overlay = document.createElement('div');
  overlay.id = 'pinGuard';
  overlay.innerHTML = `
    <div style="position:fixed;inset:0;background:#07070f;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
      <div style="font-size:20px;font-weight:800;color:#88aaff">🔐 RollHouse PRO</div>
      <div style="font-size:13px;color:#445;margin-bottom:4px">Введіть PIN для доступу</div>
      <div style="display:flex;gap:10px;margin-bottom:8px" id="pgDots">
        ${[0,1,2,3].map(i=>`<div id="pgd${i}" style="width:14px;height:14px;border-radius:50%;border:2px solid #334;transition:.15s"></div>`).join('')}
      </div>
      <div style="color:#ff6666;font-size:12px;height:16px" id="pgErr"></div>
      <div style="display:grid;grid-template-columns:repeat(3,56px);gap:8px;margin-top:4px">
        ${[1,2,3,4,5,6,7,8,9,'','0','⌫'].map(k=>`<button onclick="pgKey('${k}')" style="height:56px;background:#111128;border:1px solid #1e1e38;border-radius:10px;color:#ccd;font-size:18px;font-weight:700;cursor:pointer;font-family:inherit">${k}</button>`).join('')}
      </div>
    </div>`;
  document.body.appendChild(overlay);
  let _p = '';
  window.pgKey = async function(k) {
    if (k === '⌫') { _p = _p.slice(0,-1); } else if (k !== '' && _p.length < 4) { _p += k; }
    for(let i=0;i<4;i++) document.getElementById('pgd'+i).style.background = i<_p.length?'#88aaff':'transparent';
    if (_p.length < 4) return;
    try {
      const r = await fetch('/api/auth/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:_p})});
      const d = await r.json();
      if (d.ok) { sessionStorage.setItem('rh_pin_ok','1'); overlay.remove(); delete window.pgKey; init(); }
      else { document.getElementById('pgErr').textContent=d.error||'Невірний PIN'; _p=''; for(let i=0;i<4;i++) document.getElementById('pgd'+i).style.background='transparent'; }
    } catch(e) { document.getElementById('pgErr').textContent='Сервер не відповідає'; _p=''; }
  };
  document.addEventListener('keydown', function h(e){
    if (!document.getElementById('pinGuard')) { document.removeEventListener('keydown',h); return; }
    if (e.key>='0'&&e.key<='9') pgKey(e.key);
    else if (e.key==='Backspace') pgKey('⌫');
  });
})();

async function loadStats() {
  try {
    const d = await fetch('/api/customers/stats').then(r => r.json());
    const bar = document.getElementById('statsBar');
    bar.innerHTML = [
      `<span>👥 Всього: <b style="color:#88aaff">${d.total || 0}</b></span>`,
      `<span>⭐ VIP: <b style="color:#ffcc55">${d.vip || 0}</b></span>`,
      `<span>🚫 Заблоковані: <b style="color:#ff6666">${d.blocked || 0}</b></span>`,
    ].join('<span style="color:#1e1e38">│</span>');
  } catch(e) {}
}

function init() {
  loadStats();
  setFilter('all');
}

// Init
if (sessionStorage.getItem('rh_pin_ok') === '1') init();

// ── Duplicate finder ──────────────────────────────────────────────

let _dupVisible = false;
let _dupPairs = [];
let _mergeA = null, _mergeB = null, _keepSide = 'a';

function toggleDuplicates() {
  _dupVisible = !_dupVisible;
  const sec = document.getElementById('dupSection');
  const btn = document.getElementById('chipDups');
  sec.style.display = _dupVisible ? 'block' : 'none';
  btn.classList.toggle('active', _dupVisible);
  if (_dupVisible) loadDuplicates();
}

async function loadDuplicates() {
  document.getElementById('dupList').innerHTML = '<span class="dup-empty">Завантаження...</span>';
  try {
    const r = await fetch('/api/customers/duplicates?limit=50');
    const d = await r.json();
    renderDups(d.items || []);
  } catch(e) {
    document.getElementById('dupList').innerHTML = '<span class="dup-empty">Помилка: ' + esc(e.message) + '</span>';
  }
}

function renderDups(pairs) {
  _dupPairs = pairs || [];
  const el = document.getElementById('dupList');
  if (!_dupPairs.length) {
    el.innerHTML = '<span class="dup-empty">✅ Дублікатів не знайдено</span>';
    return;
  }
  el.innerHTML = _dupPairs.map(function(p, i) {
    const a = p.a, b = p.b;
    return `<div class="dup-pair" id="dup-pair-${i}">
      <div class="dup-card">
        <div class="dup-card-name">${esc(a.name || '—')}</div>
        <div class="dup-card-phone">${esc(a.phone)}</div>
        <div class="dup-card-orders">${a.total_orders || 0} замовлень</div>
      </div>
      <div class="dup-sep">↔</div>
      <div class="dup-card">
        <div class="dup-card-name">${esc(b.name || '—')}</div>
        <div class="dup-card-phone">${esc(b.phone)}</div>
        <div class="dup-card-orders">${b.total_orders || 0} замовлень</div>
      </div>
      <button class="btn-merge" onclick="openMergeModal(${i})">Об'єднати</button>
    </div>`;
  }).join('');
}

function openMergeModal(idx) {
  const p = _dupPairs[idx];
  if (!p) return;
  const a = p.a, b = p.b;
  _mergeA = a; _mergeB = b; _keepSide = 'a';
  const overlay = document.createElement('div');
  overlay.className = 'merge-overlay';
  overlay.id = 'mergeOverlay';
  overlay.innerHTML = `
    <div class="merge-modal">
      <h3>🔀 Об'єднати клієнтів</h3>
      <p class="merge-note">Оберіть запис, який залишиться в базі.<br>
      Замовлення, нагадування та статистика іншого запису перенесуться до нього.</p>
      <div class="merge-choice">
        <div class="merge-opt selected" id="optA" onclick="selectKeep('a')">
          <div class="merge-opt-label">Залишити</div>
          <div class="merge-opt-name">${esc(a.name || '—')}</div>
          <div class="merge-opt-phone">${esc(a.phone)}</div>
          <div class="merge-opt-orders">${a.total_orders || 0} замовлень</div>
        </div>
        <div class="merge-opt" id="optB" onclick="selectKeep('b')">
          <div class="merge-opt-label">Залишити</div>
          <div class="merge-opt-name">${esc(b.name || '—')}</div>
          <div class="merge-opt-phone">${esc(b.phone)}</div>
          <div class="merge-opt-orders">${b.total_orders || 0} замовлень</div>
        </div>
      </div>
      <div id="mergeErr" style="color:#ef4444;font-size:12px;margin-bottom:10px;display:none"></div>
      <div class="merge-btns">
        <button class="btn-merge-cancel" onclick="closeMergeModal()">Скасувати</button>
        <button class="btn-merge-confirm" id="btnConfirmMerge" onclick="confirmMerge()">Об'єднати</button>
      </div>
    </div>`;
  overlay.addEventListener('click', function(e) { if (e.target === overlay) closeMergeModal(); });
  document.body.appendChild(overlay);
}

function selectKeep(side) {
  _keepSide = side;
  document.getElementById('optA').classList.toggle('selected', side === 'a');
  document.getElementById('optB').classList.toggle('selected', side === 'b');
}

function closeMergeModal() {
  const el = document.getElementById('mergeOverlay');
  if (el) el.remove();
  _mergeA = null; _mergeB = null;
}

async function confirmMerge() {
  if (!_mergeA || !_mergeB) return;
  const keepId = _keepSide === 'a' ? _mergeA.id : _mergeB.id;
  const dropId = _keepSide === 'a' ? _mergeB.id : _mergeA.id;
  const btn = document.getElementById('btnConfirmMerge');
  btn.disabled = true; btn.textContent = "Об'єдную...";
  const errEl = document.getElementById('mergeErr');
  errEl.style.display = 'none';
  try {
    const r = await fetch('/api/customers/merge', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ keep_id: keepId, drop_id: dropId, actor_id: 0, actor_role: 'manager' })
    });
    const d = await r.json();
    if (d.ok) {
      closeMergeModal();
      loadStats();
      loadDuplicates();
    } else {
      errEl.textContent = d.error || 'Помилка злиття';
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = "Об'єднати";
    }
  } catch(e) {
    errEl.textContent = 'Помилка мережі: ' + e.message;
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = "Об'єднати";
  }
}

// ─── CSV Import ──────────────────────────────────────────────────────────────

let _csvRows = [];     // raw parsed rows (arrays)
let _csvHeaders = [];  // header strings

function openImportModal() {
  const overlay = document.createElement('div');
  overlay.className = 'import-overlay';
  overlay.id = 'importOverlay';
  overlay.innerHTML = `
    <div class="import-modal">
      <h3>📥 Імпорт клієнтів з CSV</h3>
      <p>Файл має містити колонку з телефоном. Додаткові колонки: ім'я, нотатки, день народження.<br>
         Кодування UTF-8 або Windows-1251. Роздільник: кома або крапка з комою.</p>

      <input type="file" class="import-file-input" id="importFileInput" accept=".csv,text/csv" onchange="handleCsvFile(this)">

      <div class="import-drop" id="importDrop"
           onclick="document.getElementById('importFileInput').click()"
           ondragover="event.preventDefault();this.classList.add('drag')"
           ondragleave="this.classList.remove('drag')"
           ondrop="event.preventDefault();this.classList.remove('drag');handleDropFile(event)">
        <div class="import-drop-icon">📂</div>
        <div class="import-drop-text">Клікніть або перетягніть CSV-файл сюди</div>
        <div class="import-drop-hint" id="importDropHint">Підтримується .csv (до 50 000 рядків)</div>
      </div>

      <div id="importMapping" style="display:none">
        <div class="import-mapping">
          <div class="import-mapping-title">Відповідність колонок</div>
          <div class="import-map-row">
            <span class="import-map-label">📞 Телефон *</span>
            <select class="import-map-select" id="mapPhone"></select>
          </div>
          <div class="import-map-row">
            <span class="import-map-label">👤 Ім'я</span>
            <select class="import-map-select" id="mapName"></select>
          </div>
          <div class="import-map-row">
            <span class="import-map-label">📝 Нотатки</span>
            <select class="import-map-select" id="mapNotes"></select>
          </div>
          <div class="import-map-row">
            <span class="import-map-label">🎂 День нар.</span>
            <select class="import-map-select" id="mapBday"></select>
          </div>
        </div>

        <div class="import-preview" id="importPreview"></div>

        <div id="importResult" style="display:none" class="import-result"></div>

        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px">
          <button class="btn-merge-cancel" onclick="closeImportModal()">Закрити</button>
          <button class="btn-import" id="btnDoImport" onclick="doImport()">Імпортувати</button>
        </div>
      </div>

      <div id="importNoMapping" style="text-align:right;margin-top:14px">
        <button class="btn-merge-cancel" onclick="closeImportModal()">Закрити</button>
      </div>
    </div>`;
  overlay.addEventListener('click', function(e) { if (e.target === overlay) closeImportModal(); });
  document.body.appendChild(overlay);
  _csvRows = []; _csvHeaders = [];
}

function closeImportModal() {
  const el = document.getElementById('importOverlay');
  if (el) el.remove();
  _csvRows = []; _csvHeaders = [];
}

function handleDropFile(e) {
  const file = e.dataTransfer.files[0];
  if (file) parseCsvFile(file);
}

function handleCsvFile(input) {
  const file = input.files[0];
  if (file) parseCsvFile(file);
}

function parseCsvFile(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    let text = e.target.result;
    // Try decode as UTF-8; if garbled we already have it from FileReader default
    processCsvText(text, file.name);
  };
  // Try UTF-8 first; fallback for win-1251 via binary read
  reader.readAsText(file, 'utf-8');
}

function detectDelimiter(line) {
  const sc = (line.match(/;/g) || []).length;
  const cc = (line.match(/,/g) || []).length;
  return sc >= cc ? ';' : ',';
}

function csvSplitLine(line, delim) {
  // Simple CSV split with basic quote support
  const result = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQ = !inQ; }
    else if (ch === delim && !inQ) { result.push(cur.trim()); cur = ''; }
    else { cur += ch; }
  }
  result.push(cur.trim());
  return result;
}

function processCsvText(text, filename) {
  const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').filter(l => l.trim());
  if (lines.length < 2) {
    document.getElementById('importDropHint').textContent = '⚠️ Файл порожній або немає даних';
    return;
  }
  const delim = detectDelimiter(lines[0]);
  _csvHeaders = csvSplitLine(lines[0], delim).map(h => h.replace(/^["']|["']$/g, '').trim());
  _csvRows = lines.slice(1).map(l => csvSplitLine(l, delim).map(c => c.replace(/^["']|["']$/g, '').trim()));

  document.getElementById('importDropHint').textContent =
    `✅ ${filename} — ${_csvRows.length} рядків, ${_csvHeaders.length} колонок`;
  document.getElementById('importNoMapping').style.display = 'none';
  document.getElementById('importMapping').style.display = 'block';

  // Populate select options
  const noneOpt = '<option value="">— не використовувати —</option>';
  const headerOpts = _csvHeaders.map((h, i) => `<option value="${i}">${h}</option>`).join('');
  ['mapPhone', 'mapName', 'mapNotes', 'mapBday'].forEach((id, fi) => {
    const sel = document.getElementById(id);
    sel.innerHTML = (fi === 0 ? '' : noneOpt) + headerOpts;
    sel.onchange = updateImportPreview;
  });

  // Auto-detect common column names
  const guess = (keywords) => {
    const idx = _csvHeaders.findIndex(h => keywords.some(k => h.toLowerCase().includes(k)));
    return idx >= 0 ? String(idx) : '';
  };
  document.getElementById('mapPhone').value = guess(['phone','телефон','тел','mobile','phone']);
  document.getElementById('mapName').value  = guess(['name','ім\'я','имя','назва','клієнт']);
  document.getElementById('mapNotes').value = guess(['note','нотат','комент','примітк']);
  document.getElementById('mapBday').value  = guess(['birth','народж','bday','дата_нар']);

  updateImportPreview();
}

function getColIdx(selectId) {
  const v = document.getElementById(selectId).value;
  return v === '' ? -1 : parseInt(v);
}

function updateImportPreview() {
  const iP = getColIdx('mapPhone');
  const iN = getColIdx('mapName');
  const iNt = getColIdx('mapNotes');
  const iB  = getColIdx('mapBday');

  const preview = _csvRows.slice(0, 5);
  const rows = preview.map(r => {
    const phone = iP >= 0 ? (r[iP] || '') : '';
    const name  = iN >= 0 ? (r[iN] || '') : '';
    const notes = iNt >= 0 ? (r[iNt] || '') : '';
    const bday  = iB >= 0 ? (r[iB] || '') : '';
    return `<tr><td>${esc(phone)}</td><td>${esc(name)}</td><td>${esc(notes)}</td><td>${esc(bday)}</td></tr>`;
  }).join('');

  document.getElementById('importPreview').innerHTML = `
    <div class="import-preview-title">Попередній перегляд (перші 5 рядків)</div>
    <table>
      <tr><th>Телефон</th><th>Ім'я</th><th>Нотатки</th><th>День народж.</th></tr>
      ${rows}
    </table>`;
  document.getElementById('importResult').style.display = 'none';
}

async function doImport() {
  const iP  = getColIdx('mapPhone');
  if (iP < 0) { alert('Оберіть колонку з телефоном!'); return; }
  const iN  = getColIdx('mapName');
  const iNt = getColIdx('mapNotes');
  const iB  = getColIdx('mapBday');

  const rows = _csvRows.map(r => {
    const obj = { phone: r[iP] || '' };
    if (iN  >= 0 && r[iN])  obj.name     = r[iN];
    if (iNt >= 0 && r[iNt]) obj.notes    = r[iNt];
    if (iB  >= 0 && r[iB])  obj.birthday = r[iB];
    return obj;
  }).filter(o => o.phone.trim());

  const btn = document.getElementById('btnDoImport');
  btn.disabled = true; btn.textContent = 'Імпортую...';

  try {
    const resp = await fetch('/api/customers/import', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ rows, actor_id: 0 })
    });
    const d = await resp.json();
    const res = document.getElementById('importResult');
    res.style.display = 'block';
    if (d.ok) {
      let html = `<div class="import-result-ok">✅ Імпортовано: ${d.imported}</div>`;
      if (d.skipped) html += `<div class="import-result-skip">⚠️ Пропущено (дублікати / помилки): ${d.skipped}</div>`;
      if (d.errors && d.errors.length) {
        html += `<div class="import-result-err">${d.errors.map(e => esc(e)).join('<br>')}</div>`;
      }
      res.innerHTML = html;
      btn.textContent = 'Готово ✓';
      if (d.imported > 0) { loadStats(); load(0); }
    } else {
      res.innerHTML = `<div style="color:#ff7777">❌ Помилка: ${esc(d.error || 'Невідома помилка')}</div>`;
      btn.disabled = false; btn.textContent = 'Імпортувати';
    }
  } catch(e) {
    document.getElementById('importResult').innerHTML = `<div style="color:#ff7777">❌ Мережева помилка: ${esc(e.message)}</div>`;
    document.getElementById('importResult').style.display = 'block';
    btn.disabled = false; btn.textContent = 'Імпортувати';
  }
}
</script>
