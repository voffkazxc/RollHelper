<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вхід — RollHouse PRO</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0D0F14;
      --surface:   #161920;
      --border:    rgba(255,255,255,.08);
      --accent:    #FF6B35;
      --accent-hov:#FF8555;
      --text:      #E8EAF0;
      --muted:     #6B7280;
      --error:     #EF4444;
      --success:   #22C55E;
      --radius:    12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-mark {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--accent);
      line-height: 1;
    }
    .logo-sub {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .field {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: .5px;
    }
    .input-wrap {
      position: relative;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      padding: 10px 14px;
      outline: none;
      transition: border-color .15s;
    }
    input:focus {
      border-color: var(--accent);
    }
    input.error-field {
      border-color: var(--error) !important;
    }

    .pw-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 16px;
      padding: 4px;
      line-height: 1;
      transition: color .15s;
    }
    .pw-toggle:hover { color: var(--text); }

    #pwInput { padding-right: 36px; }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: background .15s, opacity .15s;
      margin-top: 8px;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hov); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

    #errMsg {
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.25);
      border-radius: 8px;
      color: var(--error);
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: none;
      line-height: 1.4;
    }
    #errMsg.show { display: block; }

    #lockMsg {
      background: rgba(239,68,68,.08);
      border: 1px solid rgba(239,68,68,.2);
      border-radius: 8px;
      color: var(--error);
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: none;
      text-align: center;
    }
    #lockMsg.show { display: block; }

    .attempts {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      margin-top: 12px;
    }
    .attempts.warn { color: #F59E0B; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-mark">🍣 RollHouse</div>
      <div class="logo-sub">PRO Dashboard</div>
    </div>

    <div id="lockMsg"></div>
    <div id="errMsg"></div>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="loginInput">Логін</label>
        <input type="text" id="loginInput" autocomplete="username"
               placeholder="Введіть логін" autofocus spellcheck="false">
      </div>
      <div class="field">
        <label for="pwInput">Пароль</label>
        <div class="input-wrap">
          <input type="password" id="pwInput" autocomplete="current-password"
                 placeholder="Введіть пароль">
          <button type="button" class="pw-toggle" id="pwToggle" title="Показати/приховати">👁</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">
        Увійти
      </button>
    </form>

    <div class="attempts" id="attemptsInfo"></div>
  </div>

  <script>
    const API        = '';
    const loginInput = document.getElementById('loginInput');
    const pwInput    = document.getElementById('pwInput');
    const submitBtn  = document.getElementById('submitBtn');
    const errMsg     = document.getElementById('errMsg');
    const lockMsg    = document.getElementById('lockMsg');
    const attInfo    = document.getElementById('attemptsInfo');

    // Show/hide password
    document.getElementById('pwToggle').addEventListener('click', () => {
      pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
    });

    // Lockout countdown timer
    let lockTimer = null;
    function startLockCountdown(sec) {
      clearInterval(lockTimer);
      let remaining = sec;
      const tick = () => {
        if (remaining <= 0) {
          clearInterval(lockTimer);
          lockMsg.className = '';
          lockMsg.textContent = '';
          submitBtn.disabled = false;
          return;
        }
        const m = Math.floor(remaining / 60);
        const s = remaining % 60;
        lockMsg.className = 'show';
        lockMsg.textContent = `🔒 Забагато спроб. Спробуйте через ${m}:${String(s).padStart(2,'0')}`;
        submitBtn.disabled = true;
        remaining--;
      };
      tick();
      lockTimer = setInterval(tick, 1000);
    }

    function showError(msg) {
      errMsg.textContent = msg;
      errMsg.className = 'show';
      loginInput.classList.add('error-field');
      pwInput.classList.add('error-field');
    }

    function clearErrors() {
      errMsg.className = '';
      errMsg.textContent = '';
      loginInput.classList.remove('error-field');
      pwInput.classList.remove('error-field');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();

      const login    = loginInput.value.trim();
      const password = pwInput.value;

      if (!login || !password) {
        showError('Введіть логін та пароль.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>Вхід...';

      try {
        const res = await fetch(`${API}/api/auth/login`, {
          method:  'POST',
          headers: {'Content-Type': 'application/json'},
          body:    JSON.stringify({ login, password }),
          credentials: 'same-origin',
        });
        const data = await res.json();

        if (res.status === 429 || data.error_code === 'AUTH_LOCKED') {
          const sec = data.retry_after_sec || 900;
          startLockCountdown(sec);
          clearErrors();
          return;
        }

        if (!data.ok) {
          showError(data.error || 'Помилка входу');
          const left = data.attempts_left;
          if (typeof left === 'number') {
            attInfo.className = left <= 2 ? 'attempts warn' : 'attempts';
            attInfo.textContent = left > 0
              ? `Залишилось спроб: ${left}`
              : 'Обліковий запис буде заблоковано при наступній невдалій спробі';
          }
          return;
        }

        attInfo.textContent = '';
        const redirect = new URLSearchParams(window.location.search).get('next') || '/dashboard';
        window.location.href = redirect;

      } catch (err) {
        showError('Не вдалося підключитись до сервера. Перевірте підключення.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Увійти';
      }
    });

    // Enter key on login field
    loginInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); pwInput.focus(); }
    });
  </script>
</body>
</html>
