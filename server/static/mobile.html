<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>RollHouse PRO — Mobile</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Segoe UI', -apple-system, sans-serif;
  background: #0a0a14;
  color: #d0d0e0;
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
}

/* ── Top bar ── */
.topbar {
  background: #111120;
  border-bottom: 1px solid #1e1e38;
  padding: 0 14px;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar .logo { font-size: 14px; font-weight: 800; color: #88aaff; flex: 1; }
.topbar .icon-btn {
  background: none; border: 1px solid #252545; border-radius: 8px;
  color: #5566aa; padding: 6px 10px; font-size: 14px; cursor: pointer;
}
.topbar .icon-btn:active { background: rgba(100,120,255,.12); }

/* ── KPI strip ── */
.kpi-strip {
  display: flex; overflow-x: auto; gap: 10px; padding: 12px 14px;
  scrollbar-width: none; border-bottom: 1px solid #131328;
}
.kpi-strip::-webkit-scrollbar { display: none; }
.kpi-pill {
  flex-shrink: 0; background: #111120; border: 1px solid #1e1e38;
  border-radius: 10px; padding: 8px 14px; text-align: center; min-width: 90px;
}
.kpi-val  { font-size: 18px; font-weight: 800; color: #ccd; }
.kpi-lab  { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: #445; font-weight: 700; margin-top: 2px; }
.kpi-pill.green .kpi-val { color: #66dd99; }
.kpi-pill.blue  .kpi-val { color: #88aaff; }
.kpi-pill.yellow .kpi-val { color: #ffcc55; }

/* ── Filter chips ── */
.filter-chips {
  display: flex; overflow-x: auto; gap: 6px; padding: 10px 14px;
  scrollbar-width: none;
}
.filter-chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; padding: 5px 13px; border-radius: 20px;
  font-size: 12px; font-weight: 700; border: 1px solid #252545;
  color: #556; background: none; cursor: pointer; transition: all .12s;
}
.chip.active {
  border-color: #4466cc; color: #88aaff; background: rgba(68,102,204,.15);
}

/* ── Search bar ── */
.search-bar {
  padding: 0 14px 10px;
}
.search-bar input {
  width: 100%; background: #0e0e22; border: 1px solid #252545; border-radius: 10px;
  color: #d0d0e8; font-size: 14px; padding: 10px 14px; outline: none; font-family: inherit;
}
.search-bar input:focus { border-color: #4466cc; }

/* ── Order cards ── */
.cards { padding: 0 14px 80px; }

.order-card {
  background: #111120;
  border: 1px solid #1e1e38;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: border-color .12s;
  position: relative;
}
.order-card:active { border-color: #4466cc; }

.card-header {
  display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;
}
.card-id { font-size: 13px; font-weight: 800; color: #88aaff; }
.card-time { font-size: 11px; color: #445; }
.card-status { display: inline-block; padding: 2px 10px; border-radius: 20px;
               font-size: 11px; font-weight: 800; }

.card-phone { font-size: 14px; font-weight: 700; color: #d0d0e8; margin-bottom: 2px; }
.card-name  { font-size: 12px; color: #667; }
.card-addr  { font-size: 12px; color: #8899bb; margin-top: 6px; display: flex; gap: 4px; align-items: flex-start; }

.card-footer {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 10px; padding-top: 8px; border-top: 1px solid #131328;
}
.card-amount { font-size: 16px; font-weight: 800; color: #66dd99; }
.card-pay    { font-size: 11px; color: #5566aa; }
.card-courier { font-size: 11px; color: #88ccaa; }

/* Tag chips on cards */
.card-tags { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 5px; }
.tag { display:inline-block; font-size:9px; font-weight:800; padding:1px 6px;
       border-radius:20px; letter-spacing:.3px; }
.tag-urgent  { background:#3a1000; color:#ff7733; border:1px solid #7a2200; }
.tag-allergy { background:#2a0a00; color:#ff9944; border:1px solid #6a2200; }
.tag-vip     { background:#2a2000; color:#ffcc55; border:1px solid #665500; }
.tag-problem { background:#2a0010; color:#ff6666; border:1px solid #660022; }

/* Status classes */
.st-new       { background:#0d0d2a; color:#99aaff; border:1px solid #2233aa; }
.st-confirmed { background:#0a1a2a; color:#66ccff; border:1px solid #1155aa; }
.st-cooking   { background:#1a1000; color:#ffbb44; border:1px solid #554400; }
.st-on_way    { background:#0a1a10; color:#55dd88; border:1px solid #115522; }
.st-delivered { background:#0a200a; color:#44cc66; border:1px solid #115511; }
.st-cancelled { background:#200a0a; color:#ff6666; border:1px solid #551111; }

/* ── FAB ── */
.fab {
  position: fixed; bottom: 20px; right: 20px;
  width: 54px; height: 54px; border-radius: 50%;
  background: #1a2055; border: 1px solid #4466cc;
  color: #88aaff; font-size: 24px; font-weight: 800;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 18px rgba(68,102,204,.3);
  z-index: 50;
}
.fab:active { background: #243080; }

/* ── Bottom sheet (order detail) ── */
.sheet-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.6);
  z-index: 200; display: none;
}
.sheet-overlay.open { display: block; }

.bottom-sheet {
  position: fixed; left: 0; right: 0; bottom: 0;
  max-width: 480px; margin: 0 auto;
  background: #111120; border-top: 1px solid #1e1e38;
  border-radius: 18px 18px 0 0;
  z-index: 201;
  transform: translateY(100%);
  transition: transform .25s cubic-bezier(.32,0,.15,1);
  max-height: 85vh;
  overflow-y: auto;
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.bottom-sheet.open { transform: translateY(0); }

.sheet-handle {
  width: 36px; height: 4px; background: #252545; border-radius: 4px;
  margin: 12px auto 0;
}
.sheet-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 16px 10px;
  border-bottom: 1px solid #1e1e38;
}
.sheet-title { font-size: 16px; font-weight: 800; color: #ccd; }
.sheet-close { background: none; border: none; color: #556; font-size: 22px; cursor: pointer; }

.sheet-body { padding: 14px 16px; }
.sf { display: flex; flex-direction: column; gap: 2px; margin-bottom: 12px; }
.sf .sl { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #445; font-weight: 700; }
.sf .sv { font-size: 14px; color: #ccd; }

.sheet-actions {
  display: flex; gap: 8px; flex-wrap: wrap; padding: 0 16px 14px;
}
.sa-btn {
  flex: 1; min-width: 120px; padding: 10px; border-radius: 10px; text-align: center;
  font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid #252545;
  color: #5566aa; background: none; font-family: inherit;
}
.sa-btn.primary { background: #1a2055; border-color: #4466cc; color: #88aaff; }
.sa-btn.danger  { background: none; border-color: #551111; color: #ff6666; }
.sa-btn:active  { filter: brightness(.8); }

.status-btns { padding: 0 16px 14px; }
.status-btns .sb-title { font-size: 11px; color: #445; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 8px; }
.status-btns .sb-row { display: flex; gap: 6px; flex-wrap: wrap; }
.st-btn {
  flex: 1; min-width: 100px; padding: 8px; border-radius: 8px; text-align: center;
  font-size: 12px; font-weight: 700; cursor: pointer; border: none; font-family: inherit;
}

/* ── Toast ── */
.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
  background: #1a2055; border: 1px solid #4466cc; border-radius: 10px;
  color: #88aaff; padding: 10px 20px; font-size: 13px; font-weight: 700;
  z-index: 999; display: none; white-space: nowrap; max-width: 90vw;
}
.toast.err  { background: #2a0a0a; border-color: #cc3333; color: #ff7766; }
.toast.show { display: block; }

.empty { text-align: center; color: #334; padding: 60px 20px; font-size: 14px; }
.loader-msg { text-align: center; color: #445; padding: 60px 20px; font-size: 14px; }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <span class="logo">🍣 RollHouse PRO</span>
  <button class="icon-btn" onclick="loadData()" title="Оновити">↻</button>
  <button class="icon-btn" onclick="openNewOrder()" title="Нове замовлення">＋</button>
  <a id="reminderNavBtn" href="/dashboard" style="display:none;border:1px solid #cc5500;color:#ffaa44;border-radius:20px;padding:3px 10px;font-size:12px;text-decoration:none" title="Є нагадування">🔔<span id="reminderNavCount"></span></a>
</div>
<script>
(function() {
  async function checkDue() {
    try {
      const d = await (await fetch('/api/reminders/due-count')).json();
      const btn = document.getElementById('reminderNavBtn');
      if (d.count > 0) { document.getElementById('reminderNavCount').textContent = ' ' + d.count; btn.style.display = 'inline'; }
      else btn.style.display = 'none';
    } catch {}
  }
  checkDue(); setInterval(checkDue, 60000);
})();
</script>

<!-- KPI strip -->
<div class="kpi-strip" id="kpiStrip">
  <div class="kpi-pill blue"><div class="kpi-val" id="kOrders">—</div><div class="kpi-lab">Замовлень</div></div>
  <div class="kpi-pill green"><div class="kpi-val" id="kRev">—</div><div class="kpi-lab">Виручка</div></div>
  <div class="kpi-pill yellow"><div class="kpi-val" id="kNew">—</div><div class="kpi-lab">Нових клієнтів</div></div>
</div>

<!-- Status filter chips -->
<div class="filter-chips" id="filterChips">
  <button class="chip active" data-s="" onclick="setStatus(this, '')">Всі</button>
  <button class="chip" data-s="new" onclick="setStatus(this,'new')">Нові</button>
  <button class="chip" data-s="confirmed" onclick="setStatus(this,'confirmed')">Підтверджено</button>
  <button class="chip" data-s="cooking" onclick="setStatus(this,'cooking')">Готується</button>
  <button class="chip" data-s="on_way" onclick="setStatus(this,'on_way')">В дорозі</button>
  <button class="chip" data-s="delivered" onclick="setStatus(this,'delivered')">Доставлено</button>
  <button class="chip" data-s="cancelled" onclick="setStatus(this,'cancelled')">Скасовано</button>
</div>

<!-- Search -->
<div class="search-bar">
  <input type="search" id="mSearch" placeholder="🔍 Пошук по телефону або імені..." oninput="debouncedLoad()">
</div>

<!-- Order cards -->
<div class="cards" id="cards">
  <div class="loader-msg">Завантаження...</div>
</div>

<!-- FAB: new order (shortcut to desktop) -->
<a class="fab" href="/dashboard" title="Повний дашборд">⇱</a>

<!-- Sheet overlay -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>

<!-- Bottom sheet -->
<div class="bottom-sheet" id="bottomSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <span class="sheet-title" id="sheetTitle">Замовлення</span>
    <button class="sheet-close" onclick="closeSheet()">✕</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="status-btns" id="statusBtns" style="display:none">
    <div class="sb-title">Перевести в статус:</div>
    <div class="sb-row" id="sbRow"></div>
  </div>
  <div class="sheet-actions" id="sheetActions"></div>
</div>

<!-- Toast -->
<div class="toast" id="mToast"></div>

<script>
const API = '';  // відносні URL — same-origin cookie

const STATUS_LABELS = {
  new: 'Новий', confirmed: 'Підтверджено', cooking: 'Готується',
  on_way: 'В дорозі', delivered: 'Доставлено', cancelled: 'Скасовано',
};
const STATUS_CLASS = {
  new: 'st-new', confirmed: 'st-confirmed', cooking: 'st-cooking',
  on_way: 'st-on_way', delivered: 'st-delivered', cancelled: 'st-cancelled',
};
const TAG_META = {
  urgent:  { label: 'Терміново', icon: '🔴' },
  allergy: { label: 'Алергія',   icon: '🟡' },
  vip:     { label: 'VIP',       icon: '💜' },
  problem: { label: 'Проблема',  icon: '🟠' },
};

let _orders    = [];
let _curStatus = '';
let _debTimer  = null;
let _sheetId   = null;

// ── PIN guard ─────────────────────────────────────────────────
(function() {
  if (sessionStorage.getItem('rh_pin_ok') === '1') return;
  fetch(API + '/api/auth/verify', {method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({pin:''})}).then(r=>r.json()).then(d => {
    if (!d.ok) window.location.href = '/dashboard';
  }).catch(() => window.location.href = '/dashboard');
})();

// ── Helpers ───────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtTime(s) {
  if (!s) return '—';
  const t = s.split(' ')[1] || s;
  return t.slice(0,5);
}
function fmtDate(s) {
  if (!s) return '';
  const p = s.slice(0,10).split('-');
  return p[2] + '.' + p[1];
}
function formatPhone(p) {
  if (!p) return '';
  const d = p.replace(/\D/g,'');
  if (d.length === 12 && d.startsWith('38')) {
    return '+38 (' + d.slice(2,5) + ') ' + d.slice(5,8) + '-' + d.slice(8,10) + '-' + d.slice(10,12);
  }
  if (d.length === 10) {
    return '(' + d.slice(0,3) + ') ' + d.slice(3,6) + '-' + d.slice(6,8) + '-' + d.slice(8,10);
  }
  return p;
}
function parseTags(raw) {
  if (!raw) return [];
  return raw.split(',').map(t=>t.trim()).filter(t=>TAG_META[t]);
}
function renderTags(raw) {
  return parseTags(raw).map(t =>
    '<span class="tag tag-' + t + '">' + TAG_META[t].icon + ' ' + TAG_META[t].label + '</span>'
  ).join('');
}

// ── Status filter ─────────────────────────────────────────────
function setStatus(btn, s) {
  _curStatus = s;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

// ── Search debounce ───────────────────────────────────────────
function debouncedLoad() {
  clearTimeout(_debTimer);
  _debTimer = setTimeout(renderCards, 300);
}

// ── Load data ─────────────────────────────────────────────────
async function loadData() {
  try {
    const [kpiR, ordR] = await Promise.all([
      fetch(API + '/api/dashboard/kpi'),
      fetch(API + '/api/dashboard/orders?limit=100'),
    ]);
    const kpi  = await kpiR.json();
    const rows = await ordR.json();

    // KPI
    document.getElementById('kOrders').textContent = kpi.today_orders ?? '—';
    document.getElementById('kRev').textContent    = kpi.today_revenue != null
      ? Math.round(kpi.today_revenue).toLocaleString('uk') + ' ₴' : '—';
    document.getElementById('kNew').textContent    = kpi.new_clients ?? '—';

    _orders = Array.isArray(rows) ? rows : [];
    renderCards();
  } catch(e) {
    document.getElementById('cards').innerHTML = '<div class="loader-msg" style="color:#f77">Сервер не відповідає</div>';
  }
}

// ── Render cards ──────────────────────────────────────────────
function renderCards() {
  const q      = (document.getElementById('mSearch').value || '').toLowerCase();
  const status = _curStatus;

  let list = _orders.filter(o => {
    if (o.deleted) return false;
    if (status && o.status !== status) return false;
    if (q) {
      const phone = (o.cust_phone || o.order_phone || '').toLowerCase();
      const name  = (o.name || '').toLowerCase();
      const addr  = (o.address || '').toLowerCase();
      if (!phone.includes(q) && !name.includes(q) && !addr.includes(q)) return false;
    }
    return true;
  });

  const el = document.getElementById('cards');
  if (!list.length) {
    el.innerHTML = '<div class="empty">Замовлень не знайдено</div>';
    return;
  }

  el.innerHTML = list.map(function(o) {
    const st   = o.status || 'new';
    const tags = renderTags(o.tags || '');
    const phone = o.cust_phone || o.order_phone || '';
    const addr = [o.city, o.address].filter(Boolean).join(', ');
    const courier = o.courier_name ? '🛵 ' + o.courier_name : '';
    const payLabel = { cash: '💵 Готівка', card: '💳 Картка', online: '💻 Online' }[o.payment_type] || (o.payment_type || '');
    return '<div class="order-card" onclick="openSheet(' + o.id + ')">'
      + '<div class="card-header">'
      +   '<span class="card-id">#' + o.id + '</span>'
      +   '<span style="display:flex;gap:5px;align-items:center">'
      +     '<span style="font-size:11px;color:#445">' + fmtDate(o.order_date) + ' ' + fmtTime(o.order_date) + '</span>'
      +     '<span class="card-status ' + (STATUS_CLASS[st]||'st-new') + '">' + (STATUS_LABELS[st]||st) + '</span>'
      +   '</span>'
      + '</div>'
      + '<div class="card-phone">' + esc(formatPhone(phone)) + '</div>'
      + (o.name ? '<div class="card-name">' + esc(o.name) + '</div>' : '')
      + (addr ? '<div class="card-addr">📍 ' + esc(addr) + '</div>' : '')
      + (tags ? '<div class="card-tags">' + tags + '</div>' : '')
      + '<div class="card-footer">'
      +   '<div>'
      +     '<div class="card-amount">' + (o.amount ? Math.round(o.amount).toLocaleString('uk') + ' ₴' : '—') + '</div>'
      +     '<div class="card-pay">' + payLabel + '</div>'
      +   '</div>'
      +   (courier ? '<div class="card-courier">' + esc(courier) + '</div>' : '')
      + '</div>'
      + '</div>';
  }).join('');
}

// ── Bottom sheet ──────────────────────────────────────────────
function openSheet(orderId) {
  const o = _orders.find(x => x.id === orderId);
  if (!o) return;
  _sheetId = orderId;

  const st    = o.status || 'new';
  const phone = o.cust_phone || o.order_phone || '';
  const addr  = [o.city, o.address].filter(Boolean).join(', ');
  const tags  = renderTags(o.tags || '');
  const payLabel = { cash: '💵 Готівка', card: '💳 Картка', online: '💻 Online' }[o.payment_type] || (o.payment_type || '');

  document.getElementById('sheetTitle').textContent = 'Замовлення #' + orderId;

  let body = '';
  body += sf('Статус', '<span class="card-status ' + (STATUS_CLASS[st]||'') + '">' + (STATUS_LABELS[st]||st) + '</span>');
  body += sf('Дата', fmtDate(o.order_date) + ' · ' + fmtTime(o.order_date));
  body += sf('Телефон', '<a href="tel:' + phone + '" style="color:#88aaff;font-size:15px;font-weight:700">' + esc(formatPhone(phone)) + '</a>');
  if (o.name) body += sf('Клієнт', o.name);
  if (addr)   body += sf('Адреса', addr);
  if (o.items) body += sf('Позиції', '<div style="white-space:pre-wrap;font-size:13px;color:#8899bb">' + esc(o.items) + '</div>');
  if (o.comment) body += sf('Коментар', o.comment);
  if (o.gift) body += sf('Подарунок', '🎁 ' + o.gift);
  body += sf('Сума', '<b style="font-size:17px;color:#66dd99">' + (o.amount ? Math.round(o.amount).toLocaleString('uk') + ' ₴' : '—') + '</b>');
  body += sf('Оплата', payLabel);
  if (o.courier_name) body += sf('Кур\'єр', '🛵 ' + o.courier_name);
  if (tags) body += '<div style="margin-bottom:12px">' + tags + '</div>';
  document.getElementById('sheetBody').innerHTML = body;

  // Status transitions
  const allowed = Array.isArray(o.allowed_transitions) ? o.allowed_transitions : [];
  const sbSection = document.getElementById('statusBtns');
  if (allowed.length) {
    sbSection.style.display = '';
    document.getElementById('sbRow').innerHTML = allowed.map(s =>
      '<button class="st-btn ' + (STATUS_CLASS[s]||'') + '" onclick="applyStatusSheet(\'' + s + '\')">'
      + (STATUS_LABELS[s]||s) + '</button>'
    ).join('');
  } else {
    sbSection.style.display = 'none';
  }

  // Actions
  document.getElementById('sheetActions').innerHTML =
    (phone ? '<a class="sa-btn primary" href="/card?phone=' + esc(phone) + '">👤 Картка</a>' : '')
    + '<a class="sa-btn primary" href="/receipt?order_id=' + orderId + '" target="_blank">🖨️ Чек</a>'
    + '<a class="sa-btn" href="/dashboard">🖥 Дашборд</a>';

  document.getElementById('sheetOverlay').classList.add('open');
  document.getElementById('bottomSheet').classList.add('open');
}

function sf(label, val) {
  return '<div class="sf"><div class="sl">' + label + '</div><div class="sv">' + val + '</div></div>';
}

function closeSheet() {
  document.getElementById('sheetOverlay').classList.remove('open');
  document.getElementById('bottomSheet').classList.remove('open');
  _sheetId = null;
}

async function applyStatusSheet(newStatus) {
  if (!_sheetId) return;
  const orderId = _sheetId;
  try {
    const r = await fetch(API + '/api/order/' + orderId + '/status', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({status: newStatus, actor_id: 0, actor_role: 'manager'})
    });
    const d = await r.json();
    if (r.status === 409) { showToast('🚫 ' + (d.error || 'Заборонений перехід'), true); return; }
    if (d.ok) {
      const order = _orders.find(o => o.id === orderId);
      if (order) {
        order.status = newStatus;
        order.allowed_transitions = d.allowed_transitions || [];
      }
      closeSheet();
      renderCards();
      showToast('✅ Статус змінено → ' + (STATUS_LABELS[newStatus]||newStatus));
    } else {
      showToast('❌ ' + (d.error || 'Помилка'), true);
    }
  } catch(e) {
    showToast('❌ Сервер не відповідає', true);
  }
}

function openNewOrder() {
  window.location.href = '/dashboard';
}

// ── Toast ─────────────────────────────────────────────────────
function showToast(msg, err) {
  const el = document.getElementById('mToast');
  el.textContent = msg;
  el.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

// ── Auto-refresh every 60s ────────────────────────────────────
loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
