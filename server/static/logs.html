<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RollHouse PRO — Аудит лог</title>
<script src="/static/_sidebar.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #0a0a14; color: #d0d0e0; min-height: 100vh; }

.topbar {
  background: #111120; border-bottom: 1px solid #1e1e38;
  padding: 0 20px; height: 48px;
  display: flex; align-items: center; gap: 16px;
  position: sticky; top: 0; z-index: 100;
}
.logo { font-size: 15px; font-weight: 800; color: #88aaff; }
.nav-link { font-size: 13px; color: #5566aa; text-decoration: none; padding: 4px 10px; border-radius: 6px; }
.nav-link:hover { background: rgba(100,120,255,.1); color: #88aaff; }
.spacer { flex: 1; }
.page-title { font-size: 13px; color: #5566aa; font-weight: 600; }

.filters {
  display: flex; gap: 8px; padding: 10px 20px;
  border-bottom: 1px solid #1a1a30; flex-wrap: wrap; align-items: center;
}
.filters select, .filters input {
  background: #111128; border: 1px solid #252545; border-radius: 7px;
  color: #d0d0e8; font-size: 13px; padding: 6px 10px; outline: none;
  font-family: 'Segoe UI', sans-serif;
}
.filters select:focus, .filters input:focus { border-color: #4466cc; }
.btn-load {
  padding: 6px 16px; background: #1a2055; border: 1px solid #4466cc;
  border-radius: 7px; color: #88aaff; font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: 'Segoe UI', sans-serif;
}
.btn-load:hover { background: #243080; }
.total-label { font-size: 12px; color: #445; margin-left: 4px; }

.table-wrap { overflow-x: auto; padding: 0 20px 24px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 12px; }
th {
  text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
  color: #445; font-weight: 700; padding: 0 8px 8px; border-bottom: 1px solid #1e1e38;
  white-space: nowrap;
}
td { padding: 7px 8px; border-bottom: 1px solid #131328; vertical-align: top; }
tr:hover td { background: rgba(30,30,60,.4); }

.entity-order    { color: #88aaff; }
.entity-customer { color: #66dd99; }
.entity-courier  { color: #ffcc55; }
.entity-reminder { color: #ff99aa; }
.entity-other    { color: #667; }

.action-create  { color: #66dd99; }
.action-update  { color: #88aaff; }
.action-delete  { color: #ff6666; }
.action-status  { color: #ffcc55; }
.action-login   { color: #77aadd; }
.action-other   { color: #556; }

.ts { color: #334; white-space: nowrap; }
.actor { color: #5577aa; white-space: nowrap; }
.json-cell {
  max-width: 320px; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; color: #445; cursor: pointer; font-family: monospace; font-size: 11px;
}
.json-cell:hover { color: #667; white-space: normal; word-break: break-all; }

.empty { text-align: center; color: #334; padding: 40px; font-size: 14px; }

.pagination { display: flex; gap: 8px; align-items: center; padding: 12px 20px; }
.btn-page {
  padding: 5px 14px; background: none; border: 1px solid #252545;
  border-radius: 6px; color: #5566aa; font-size: 12px; cursor: pointer;
  font-family: 'Segoe UI', sans-serif;
}
.btn-page:hover:not(:disabled) { border-color: #5566aa; color: #88aaff; }
.btn-page:disabled { opacity: .35; cursor: default; }
.page-info { font-size: 12px; color: #445; }
</style>
</head>
<body>

<div class="topbar">
  <span class="logo" style="color:#5566aa;opacity:.6">Аудит лог</span>
  <div class="spacer"></div>
</div>

<div class="filters">
  <select id="fEntity">
    <option value="">Усі сутності</option>
    <option value="order">order</option>
    <option value="customer">customer</option>
    <option value="courier">courier</option>
    <option value="reminder">reminder</option>
    <option value="operator">operator</option>
  </select>
  <input type="text" id="fAction" placeholder="Дія (create, delete, status→...)" style="width:200px">
  <input type="number" id="fActorId" placeholder="Actor ID" style="width:100px">
  <input type="date" id="fDateFrom">
  <input type="date" id="fDateTo">
  <button class="btn-load" onclick="load(0)">Знайти</button>
  <span class="total-label" id="totalLabel"></span>
</div>

<div class="table-wrap">
  <table id="logsTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Час</th>
        <th>Actor</th>
        <th>Роль</th>
        <th>Сутність</th>
        <th>Entity ID</th>
        <th>Дія</th>
        <th>Before</th>
        <th>After</th>
      </tr>
    </thead>
    <tbody id="logsTbody">
      <tr><td colspan="9" class="empty">Оберіть фільтри і натисніть «Знайти»</td></tr>
    </tbody>
  </table>
</div>

<div class="pagination">
  <button class="btn-page" id="btnPrev" onclick="prevPage()" disabled>← Назад</button>
  <span class="page-info" id="pageInfo"></span>
  <button class="btn-page" id="btnNext" onclick="nextPage()" disabled>Далі →</button>
</div>

<script>
const PAGE_SIZE = 100;
let _offset = 0;
let _total  = 0;

function params(offset) {
  const p = new URLSearchParams();
  const entity = document.getElementById('fEntity').value;
  const action = document.getElementById('fAction').value.trim();
  const actor  = document.getElementById('fActorId').value.trim();
  const df     = document.getElementById('fDateFrom').value;
  const dt     = document.getElementById('fDateTo').value;
  if (entity) p.set('entity_type', entity);
  if (action) p.set('action', action);
  if (actor)  p.set('actor_id', actor);
  if (df)     p.set('date_from', df);
  if (dt)     p.set('date_to', dt);
  p.set('limit', PAGE_SIZE);
  p.set('offset', offset);
  return p.toString();
}

async function load(offset) {
  _offset = offset;
  const tbody = document.getElementById('logsTbody');
  tbody.innerHTML = '<tr><td colspan="9" class="empty">Завантаження...</td></tr>';
  try {
    const r = await fetch('/api/admin/logs?' + params(offset));
    const d = await r.json();
    _total = d.total || 0;
    document.getElementById('totalLabel').textContent = `Знайдено: ${_total}`;
    updatePagination();
    if (!d.items || !d.items.length) {
      tbody.innerHTML = '<tr><td colspan="9" class="empty">Записів не знайдено</td></tr>';
      return;
    }
    tbody.innerHTML = d.items.map(row => {
      const ts      = (row.created_at || '').replace('T', ' ').slice(0, 19);
      const entity  = row.entity_type || '';
      const action  = row.action || '';
      const eCls    = entityClass(entity);
      const aCls    = actionClass(action);
      return `<tr>
        <td style="color:#334">${row.id}</td>
        <td class="ts">${ts}</td>
        <td class="actor">${row.actor_id || 0}</td>
        <td style="color:#445;font-size:11px">${row.actor_role || ''}</td>
        <td class="${eCls}">${entity}</td>
        <td style="color:#556">${row.entity_id || ''}</td>
        <td class="${aCls}">${esc(action)}</td>
        <td class="json-cell" title="${esc(row.before||'')}">${esc(truncate(row.before))}</td>
        <td class="json-cell" title="${esc(row.after||'')}">${esc(truncate(row.after))}</td>
      </tr>`;
    }).join('');
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="9" class="empty">Помилка: ${e.message}</td></tr>`;
  }
}

function updatePagination() {
  const page  = Math.floor(_offset / PAGE_SIZE) + 1;
  const pages = Math.ceil(_total / PAGE_SIZE) || 1;
  document.getElementById('pageInfo').textContent  = `Сторінка ${page} з ${pages}`;
  document.getElementById('btnPrev').disabled = _offset <= 0;
  document.getElementById('btnNext').disabled = _offset + PAGE_SIZE >= _total;
}

function prevPage() { if (_offset > 0) load(_offset - PAGE_SIZE); }
function nextPage() { if (_offset + PAGE_SIZE < _total) load(_offset + PAGE_SIZE); }

function entityClass(e) {
  return { order:'entity-order', customer:'entity-customer',
           courier:'entity-courier', reminder:'entity-reminder' }[e] || 'entity-other';
}
function actionClass(a) {
  if (a === 'create') return 'action-create';
  if (a.startsWith('delete') || a === 'delete') return 'action-delete';
  if (a.startsWith('status')) return 'action-status';
  if (a.startsWith('update') || a.startsWith('set')) return 'action-update';
  if (a === 'login') return 'action-login';
  return 'action-other';
}
function truncate(s) {
  if (!s) return '';
  return s.length > 80 ? s.slice(0, 80) + '…' : s;
}
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Default: today's logs
window.addEventListener('DOMContentLoaded', () => {
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('fDateFrom').value = today;
  document.getElementById('fDateTo').value   = today;
  load(0);
});

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') load(0);
});
</script>
</body>
</html>
