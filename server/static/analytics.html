<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RollHouse PRO — Аналітика</title>
<script src="/static/_sidebar.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #0a0a14; color: #d0d0e0; min-height: 100vh; }

/* ── Topbar ── */
.topbar {
  background: #111120; border-bottom: 1px solid #1e1e38;
  padding: 0 20px; height: 48px;
  display: flex; align-items: center; gap: 16px;
  position: sticky; top: 0; z-index: 100;
}
.topbar .logo { font-size: 15px; font-weight: 800; color: #88aaff; letter-spacing: .5px; }
.topbar .nav-link { font-size: 13px; color: #5566aa; text-decoration: none; padding: 4px 10px; border-radius: 6px; transition: all .15s; }
.topbar .nav-link:hover { background: rgba(100,120,255,.1); color: #88aaff; }
.topbar .spacer { flex: 1; }
.topbar .page-title { font-size: 13px; color: #5566aa; font-weight: 600; }

/* ── Period selector ── */
.period-bar {
  display: flex; align-items: center; gap: 8px; padding: 12px 20px;
  border-bottom: 1px solid #1a1a30; flex-wrap: wrap;
}
.period-btn {
  padding: 5px 14px; border-radius: 20px; border: 1px solid #252545;
  background: none; color: #5566aa; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all .15s; font-family: 'Segoe UI', sans-serif;
}
.period-btn:hover  { border-color: #5566aa; color: #88aaff; }
.period-btn.active { background: #1a2055; border-color: #4466cc; color: #88aaff; }
.period-sep { color: #2a2a50; }
.period-date {
  background: #0e0e20; border: 1px solid #252545; border-radius: 7px;
  color: #d0d0e8; font-size: 12px; padding: 5px 9px; outline: none;
  font-family: 'Segoe UI', sans-serif;
}
.period-date:focus { border-color: #4466cc; }
.btn-apply {
  padding: 5px 14px; border-radius: 7px; border: 1px solid #4466cc;
  background: #1a2055; color: #88aaff; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all .15s; font-family: 'Segoe UI', sans-serif;
}
.btn-apply:hover { background: #243080; }
.period-label { font-size: 12px; color: #445; margin-left: 4px; }

/* ── KPI row ── */
.kpi-row { display: flex; gap: 10px; padding: 14px 20px; flex-wrap: wrap; border-bottom: 1px solid #1a1a30; }
.kpi-card {
  background: #111120; border: 1px solid #1e1e3a; border-radius: 10px;
  padding: 12px 18px; min-width: 130px; flex: 1;
}
.kpi-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #445; margin-bottom: 4px; font-weight: 700; }
.kpi-val   { font-size: 24px; font-weight: 800; color: #ccd0ee; line-height: 1; }
.kpi-sub   { font-size: 11px; color: #445; margin-top: 3px; }
.kpi-card.blue   .kpi-val { color: #88aaff; }
.kpi-card.green  .kpi-val { color: #66dd99; }
.kpi-card.yellow .kpi-val { color: #ffcc55; }
.kpi-card.red    .kpi-val { color: #ff6666; }

/* ── Sections ── */
.sections { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 20px; }
@media (max-width: 900px) { .sections { grid-template-columns: 1fr; } }
.section-wide { grid-column: 1 / -1; }

.card {
  background: #111120; border: 1px solid #1e1e3a; border-radius: 12px; padding: 16px 18px;
}
.card-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #445; font-weight: 700; margin-bottom: 14px; }

/* ── Bar chart ── */
.chart-wrap { overflow-x: auto; }
.bar-svg { display: block; }
.bar-rect { transition: opacity .1s; cursor: default; }
.bar-rect:hover { opacity: .75; }

/* ── Table ── */
.a-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.a-table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #445; font-weight: 700; padding: 0 0 8px; border-bottom: 1px solid #1e1e38; }
.a-table td { padding: 7px 0; border-bottom: 1px solid #161630; color: #aab; vertical-align: top; }
.a-table td:first-child { color: #ccd; }
.a-table tr:last-child td { border-bottom: none; }
.rank { color: #445; font-size: 11px; font-weight: 700; width: 24px; display: inline-block; }
.bar-inline {
  display: inline-block; height: 6px; border-radius: 3px;
  background: #2244aa; margin-left: 6px; vertical-align: middle; opacity: .7;
}
.pct-text { font-size: 11px; color: #445; margin-left: 4px; }

/* ── Empty ── */
.empty { text-align: center; color: #334; font-size: 13px; padding: 24px 0; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: #1a1a38; border: 1px solid #3a3a70;
  color: #ccd0ee; padding: 9px 18px; border-radius: 18px;
  font-size: 13px; font-weight: 600; z-index: 999;
  transition: transform .2s ease; pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.err  { background: #2a0a0a; border-color: #661111; color: #ff8888; }
</style>
</head>
<body>

<div class="topbar">
  <span class="logo" style="color:#5566aa;opacity:.6">Аналітика</span>
  <div class="spacer"></div>
</div>

<!-- Period selector -->
<div class="period-bar">
  <button class="period-btn" data-period="today"  onclick="setPeriod('today')">Сьогодні</button>
  <button class="period-btn" data-period="week"   onclick="setPeriod('week')">7 днів</button>
  <button class="period-btn active" data-period="month" onclick="setPeriod('month')">30 днів</button>
  <button class="period-btn" data-period="year"   onclick="setPeriod('year')">Рік</button>
  <span class="period-sep">|</span>
  <input type="date" class="period-date" id="dateFrom">
  <span style="color:#334;font-size:12px">—</span>
  <input type="date" class="period-date" id="dateTo">
  <button class="btn-apply" onclick="applyCustom()">Застосувати</button>
  <span class="period-label" id="periodLabel"></span>
</div>

<!-- KPI row -->
<div class="kpi-row" id="kpiRow">
  <div class="kpi-card blue">
    <div class="kpi-label">Замовлень</div>
    <div class="kpi-val" id="kpiOrders">—</div>
    <div class="kpi-sub" id="kpiDelivery"></div>
  </div>
  <div class="kpi-card green">
    <div class="kpi-label">Виручка</div>
    <div class="kpi-val" id="kpiRevenue">—</div>
    <div class="kpi-sub" id="kpiAvg"></div>
  </div>
  <div class="kpi-card yellow">
    <div class="kpi-label">Виконано</div>
    <div class="kpi-val" id="kpiDelivered">—</div>
    <div class="kpi-sub" id="kpiDeliveredPct"></div>
  </div>
  <div class="kpi-card red">
    <div class="kpi-label">Скасовано</div>
    <div class="kpi-val" id="kpiCancelled">—</div>
    <div class="kpi-sub" id="kpiCancelledPct"></div>
  </div>
</div>

<!-- Sections -->
<div class="sections">

  <!-- Bar chart (wide) -->
  <div class="card section-wide">
    <div class="card-title">Виручка по днях</div>
    <div class="chart-wrap" id="chartWrap">
      <div class="empty">Завантаження...</div>
    </div>
  </div>

  <!-- Top customers -->
  <div class="card">
    <div class="card-title">Топ клієнти</div>
    <div id="topCustomers"><div class="empty">Завантаження...</div></div>
  </div>

  <!-- Top items -->
  <div class="card">
    <div class="card-title">Топ позиції</div>
    <div id="topItems"><div class="empty">Завантаження...</div></div>
  </div>

  <!-- Operators -->
  <div class="card section-wide">
    <div class="card-title">Оператори</div>
    <div id="operatorsTable"><div class="empty">Завантаження...</div></div>
  </div>

  <!-- Re-engagement -->
  <div class="card">
    <div class="card-title">😴 Не замовляли 30+ днів</div>
    <div id="reengagementTable"><div class="empty">Завантаження...</div></div>
  </div>

  <!-- VIP candidates -->
  <div class="card">
    <div class="card-title">⭐ Кандидати у VIP (5+ замовлень)</div>
    <div id="vipTable"><div class="empty">Завантаження...</div></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ─────────────────────────────────────────
   STATE
───────────────────────────────────────── */
let _period   = 'month';
let _dateFrom = '';
let _dateTo   = '';

/* ─────────────────────────────────────────
   INIT
───────────────────────────────────────── */
window.addEventListener('DOMContentLoaded', () => {
  const today = new Date().toISOString().slice(0, 10);
  const d30   = new Date(Date.now() - 29 * 86400000).toISOString().slice(0, 10);
  document.getElementById('dateFrom').value = d30;
  document.getElementById('dateTo').value   = today;
  loadAll();
});

/* ─────────────────────────────────────────
   PERIOD
───────────────────────────────────────── */
function setPeriod(p) {
  _period   = p;
  _dateFrom = '';
  _dateTo   = '';
  document.querySelectorAll('.period-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.period === p));
  loadAll();
}

function applyCustom() {
  _period   = 'custom';
  _dateFrom = document.getElementById('dateFrom').value;
  _dateTo   = document.getElementById('dateTo').value;
  if (!_dateFrom || !_dateTo) { showToast('Вкажіть обидві дати', 'err'); return; }
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
  loadAll();
}

function periodParams() {
  if (_dateFrom && _dateTo)
    return `date_from=${_dateFrom}&date_to=${_dateTo}`;
  return `period=${_period}`;
}

/* ─────────────────────────────────────────
   LOAD ALL
───────────────────────────────────────── */
async function loadAll() {
  await Promise.all([loadSummary(), loadDaily(), loadTopCustomers(), loadTopItems(), loadOperators(), loadReengagement(), loadVipCandidates()]);
}

async function loadSummary() {
  try {
    const r = await fetch('/api/analytics/summary?' + periodParams());
    const d = await r.json();
    if (!d.ok) return;
    document.getElementById('kpiOrders').textContent    = d.total_orders;
    document.getElementById('kpiDelivery').textContent  = `доставок ${d.delivery_cnt} / самовивіз ${d.pickup_cnt}`;
    document.getElementById('kpiRevenue').textContent   = fmtMoney(d.revenue);
    document.getElementById('kpiAvg').textContent       = `середній чек ${fmtMoney(d.avg_check)}`;
    document.getElementById('kpiDelivered').textContent = d.delivered;
    document.getElementById('kpiDeliveredPct').textContent = `${d.delivered_pct}% від усіх`;
    document.getElementById('kpiCancelled').textContent = d.cancelled;
    document.getElementById('kpiCancelledPct').textContent = `${d.cancelled_pct}% від усіх`;
    document.getElementById('periodLabel').textContent  = `${d.date_from} → ${d.date_to}`;
  } catch { showToast('Помилка KPI', 'err'); }
}

async function loadDaily() {
  try {
    const r = await fetch('/api/analytics/daily?' + periodParams());
    const d = await r.json();
    renderChart(d.items || []);
  } catch {}
}

async function loadTopCustomers() {
  try {
    const r = await fetch('/api/analytics/top-customers?limit=10');
    const d = await r.json();
    renderTopCustomers(d.items || []);
  } catch {}
}

async function loadTopItems() {
  try {
    const r = await fetch('/api/analytics/top-items?' + periodParams());
    const d = await r.json();
    renderTopItems(d.items || []);
  } catch {}
}

async function loadOperators() {
  try {
    const r = await fetch('/api/analytics/operators?' + periodParams());
    const d = await r.json();
    renderOperators(d.items || []);
  } catch {}
}

/* ─────────────────────────────────────────
   CHART (inline SVG bar chart)
───────────────────────────────────────── */
function renderChart(items) {
  const wrap = document.getElementById('chartWrap');
  if (!items.length) { wrap.innerHTML = '<div class="empty">Немає даних</div>'; return; }

  const W     = Math.max(items.length * 28, 300);
  const H     = 140;
  const PAD   = { top: 10, right: 12, bottom: 30, left: 48 };
  const iW    = W - PAD.left - PAD.right;
  const iH    = H - PAD.top - PAD.bottom;
  const maxRev = Math.max(...items.map(i => i.revenue), 1);
  const barW   = Math.max(iW / items.length - 4, 4);

  let bars = '', labels = '', yLabels = '';
  const yTicks = 4;
  for (let t = 0; t <= yTicks; t++) {
    const y = PAD.top + iH - (t / yTicks) * iH;
    const v = Math.round((t / yTicks) * maxRev);
    yLabels += `<text x="${PAD.left - 6}" y="${y + 4}" text-anchor="end" fill="#334" font-size="9">${fmtK(v)}</text>`;
    yLabels += `<line x1="${PAD.left}" y1="${y}" x2="${PAD.left + iW}" y2="${y}" stroke="#151530" stroke-width="1"/>`;
  }

  items.forEach((it, i) => {
    const x     = PAD.left + i * (iW / items.length) + (iW / items.length - barW) / 2;
    const barH  = Math.max((it.revenue / maxRev) * iH, 2);
    const y     = PAD.top + iH - barH;
    const day   = it.day.slice(5);  // MM-DD
    const title = `${it.day}: ${fmtMoney(it.revenue)} (${it.orders} зам.)`;

    bars   += `<rect class="bar-rect" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="2" fill="#2244bb"><title>${esc(title)}</title></rect>`;
    // label every ~5 bars or if few bars
    if (i % Math.max(1, Math.ceil(items.length / 20)) === 0) {
      labels += `<text x="${(x + barW / 2).toFixed(1)}" y="${H - 4}" text-anchor="middle" fill="#334" font-size="8">${day}</text>`;
    }
  });

  wrap.innerHTML = `
<svg class="bar-svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">
  ${yLabels}${bars}${labels}
  <line x1="${PAD.left}" y1="${PAD.top}" x2="${PAD.left}" y2="${PAD.top + iH}" stroke="#1e1e40" stroke-width="1"/>
</svg>`;
}

/* ─────────────────────────────────────────
   TABLES
───────────────────────────────────────── */
function renderTopCustomers(items) {
  const el = document.getElementById('topCustomers');
  if (!items.length) { el.innerHTML = '<div class="empty">Немає даних</div>'; return; }
  const maxO = Math.max(...items.map(i => i.total_orders), 1);
  const rows = items.map((c, i) => `
<tr>
  <td><span class="rank">${i + 1}.</span> ${esc(c.name || c.phone)}</td>
  <td style="color:#5577aa;font-size:11px">${fmtPhone(c.phone)}</td>
  <td style="text-align:right">
    ${c.total_orders}
    <span class="bar-inline" style="width:${(c.total_orders / maxO * 60).toFixed(0)}px"></span>
  </td>
  <td style="text-align:right;color:#66dd99">${fmtMoney(c.total_spent)}</td>
</tr>`).join('');
  el.innerHTML = `<table class="a-table">
<thead><tr><th>Клієнт</th><th>Телефон</th><th style="text-align:right">Замовлень</th><th style="text-align:right">Витрачено</th></tr></thead>
<tbody>${rows}</tbody></table>`;
}

function renderTopItems(items) {
  const el = document.getElementById('topItems');
  if (!items.length) { el.innerHTML = '<div class="empty">Немає даних за цей період</div>'; return; }
  const maxQ = Math.max(...items.map(i => i.qty), 1);
  const rows = items.map((it, i) => `
<tr>
  <td><span class="rank">${i + 1}.</span> ${esc(it.name)}</td>
  <td style="text-align:right">
    ${it.qty}
    <span class="bar-inline" style="width:${(it.qty / maxQ * 60).toFixed(0)}px"></span>
    <span class="pct-text">${it.pct}%</span>
  </td>
</tr>`).join('');
  el.innerHTML = `<table class="a-table">
<thead><tr><th>Позиція</th><th style="text-align:right">Кількість</th></tr></thead>
<tbody>${rows}</tbody></table>`;
}

function renderOperators(items) {
  const el = document.getElementById('operatorsTable');
  if (!items.length) { el.innerHTML = '<div class="empty">Немає даних за цей період</div>'; return; }
  const rows = items.map(o => {
    const rate = o.orders ? Math.round(o.delivered / o.orders * 100) : 0;
    return `<tr>
  <td>${esc(o.name)}</td>
  <td style="text-align:center">${o.orders}</td>
  <td style="text-align:center">${o.delivered} <span class="pct-text">${rate}%</span></td>
  <td style="text-align:right;color:#66dd99">${fmtMoney(o.revenue)}</td>
</tr>`;
  }).join('');
  el.innerHTML = `<table class="a-table">
<thead><tr><th>Оператор</th><th style="text-align:center">Замовлень</th><th style="text-align:center">Виконано</th><th style="text-align:right">Виручка</th></tr></thead>
<tbody>${rows}</tbody></table>`;
}

/* ─────────────────────────────────────────
   HELPERS
───────────────────────────────────────── */
function fmtMoney(v) {
  if (v == null) return '—';
  return Number(v).toLocaleString('uk-UA', { style: 'currency', currency: 'UAH', maximumFractionDigits: 0 });
}
function fmtK(v) {
  if (v >= 1000) return (v / 1000).toFixed(v % 1000 === 0 ? 0 : 1) + 'к';
  return v;
}
function fmtPhone(p) {
  if (!p) return '';
  const d = p.replace(/^380/, '0');
  return d.length === 10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6,8)}-${d.slice(8)}` : p;
}
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let _toastTimer;
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type === 'err' ? ' err' : '') + ' show';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ─── Re-engagement ───────────────────────────────
async function loadReengagement() {
  try {
    const r = await fetch('/api/analytics/reengagement?days=30&limit=15');
    const d = await r.json();
    renderReengagement(d.items || []);
  } catch {}
}

function renderReengagement(items) {
  const el = document.getElementById('reengagementTable');
  if (!items.length) { el.innerHTML = '<div class="empty">Всі клієнти активні 🎉</div>'; return; }
  const rows = items.map(c => `<tr>
    <td><a href="/card?phone=${encodeURIComponent(c.phone)}" target="_blank" style="color:#88aaff;text-decoration:none">${esc(c.name || c.phone)}</a></td>
    <td style="text-align:center;color:#4a5">${c.total_orders}</td>
    <td style="text-align:center;color:#aa5544">${c.days_ago} дн.</td>
    <td style="text-align:right;color:#667">${c.last_order_date || '—'}</td>
  </tr>`).join('');
  el.innerHTML = `<table class="a-table">
<thead><tr><th>Клієнт</th><th style="text-align:center">Замовлень</th><th style="text-align:center">Мовчить</th><th style="text-align:right">Останнє</th></tr></thead>
<tbody>${rows}</tbody></table>`;
}

// ─── VIP candidates ──────────────────────────────
async function loadVipCandidates() {
  try {
    const r = await fetch('/api/analytics/vip-candidates?min_orders=5');
    const d = await r.json();
    renderVipCandidates(d.items || []);
  } catch {}
}

function renderVipCandidates(items) {
  const el = document.getElementById('vipTable');
  if (!items.length) { el.innerHTML = '<div class="empty">Немає кандидатів</div>'; return; }
  const rows = items.map((c, i) => `<tr>
    <td><span class="rank">${i+1}.</span> <a href="/card?phone=${encodeURIComponent(c.phone)}" target="_blank" style="color:#88aaff;text-decoration:none">${esc(c.name || c.phone)}</a></td>
    <td style="text-align:center">${c.total_orders}</td>
    <td style="text-align:right;color:#66dd99">${fmtMoney(c.total_spent)}</td>
  </tr>`).join('');
  el.innerHTML = `<table class="a-table">
<thead><tr><th>Клієнт</th><th style="text-align:center">Замовлень</th><th style="text-align:right">Витрачено</th></tr></thead>
<tbody>${rows}</tbody></table>`;
}
</script>
</body>
</html>
